<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassBoard · 课程板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1F2A24;
    --ink-soft:#3A453F;
    --paper:#F1F3EC;
    --paper-deep:#E7EBE0;
    --card:#FFFFFF;
    --moss:#3F6B52;
    --moss-dark:#2C4C3B;
    --moss-tint:#E4EDE6;
    --amber:#C98A2C;
    --amber-tint:#FBF1DF;
    --brick:#A9463D;
    --brick-tint:#F7E7E5;
    --slate:#5B6B63;
    --line:#DADFD2;
    --radius:14px;
    --shadow: 0 1px 2px rgba(31,42,36,0.06), 0 6px 20px rgba(31,42,36,0.05);
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color: transparent;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans SC', system-ui, sans-serif;
    line-height:1.55;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(31,42,36,0.05) 1px, transparent 0);
    background-size: 22px 22px;
  }
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{ background: var(--moss-tint); }
  :focus-visible{ outline: 2.5px solid var(--moss); outline-offset: 2px; }

  .wrap{ max-width: 1080px; margin: 0 auto; padding: 20px 20px 80px; }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:16px; flex-wrap:wrap; padding-top: 8px;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand-mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:9px;
    background: var(--moss); color:#fff; font-family:'Noto Serif SC', serif;
    font-weight:900; font-size:17px; flex-shrink:0;
  }
  .brand-name{ font-family:'Noto Serif SC', serif; font-weight:900; font-size:26px; letter-spacing:0.5px; }
  .brand-sub{ font-size:14px; color:var(--slate); font-weight:500; }
  .tagline{ margin: 6px 0 26px; color:var(--slate); font-size:14px; }

  .header-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn{
    border:1.5px solid var(--ink); background:var(--card); color:var(--ink);
    padding:9px 16px; border-radius:999px; font-size:14px; font-weight:600;
    transition: transform .12s ease, background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .btn:hover{ transform: translateY(-1px); }
  .btn:active{ transform: translateY(0); }
  .btn-primary{ background:var(--moss); border-color:var(--moss); color:#fff; }
  .btn-primary:hover{ background:var(--moss-dark); }
  .btn-ghost{ border-color:var(--line); }
  .btn-danger{ border-color:var(--brick); color:var(--brick); background:#fff; }
  .btn-danger:hover{ background:var(--brick-tint); }
  .btn-sm{ padding:6px 12px; font-size:13px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }

  .admin-pill{
    display:flex; align-items:center; gap:8px; background:var(--moss-tint);
    border:1px solid var(--moss); color:var(--moss-dark); font-size:13px; font-weight:700;
    padding:7px 12px 7px 10px; border-radius:999px;
  }
  .admin-pill .dot{ width:7px; height:7px; border-radius:50%; background:var(--moss); display:inline-block; }

  /* ---------- Date sections ---------- */
  .date-divider{
    display:flex; align-items:center; gap:12px; margin: 34px 0 16px;
  }
  .date-divider:first-of-type{ margin-top: 18px; }
  .date-label{
    font-family:'Noto Serif SC', serif; font-weight:700; font-size:16px;
    background:var(--ink); color:var(--paper); padding:5px 14px 5px 12px;
    border-radius: 3px 10px 10px 3px; position:relative;
  }
  .date-label::before{
    content:''; position:absolute; left:-6px; top:50%; transform:translateY(-50%);
    width:6px; height:6px; border-radius:50%; background:var(--amber);
    box-shadow: 0 0 0 2px var(--paper);
  }
  .date-line{ flex:1; height:1px; background: var(--line); }

  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:16px; }

  /* ---------- Course card ---------- */
  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    border:1px solid var(--line); padding:18px; display:flex; flex-direction:column; gap:10px;
    position:relative; overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; width:4px; height:100%; background: var(--card-accent, var(--moss));
  }
  .badges{ display:flex; gap:6px; flex-wrap:wrap; }
  .badge{
    font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px;
    background:var(--paper-deep); color:var(--ink-soft); font-family:'IBM Plex Mono', monospace;
  }
  .badge.time{ background:var(--moss-tint); color:var(--moss-dark); }
  .badge.grade{ background:var(--amber-tint); color:#8a611f; }
  .course-name{ font-family:'Noto Serif SC', serif; font-weight:700; font-size:19px; margin:2px 0 0; }
  .teacher-line{ display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--ink-soft); margin:0; }
  .teacher-line b{ font-weight:700; color:var(--ink); }
  .link-btn{
    background:none; border:none; color:var(--moss); font-size:12.5px; font-weight:700;
    text-decoration:underline; text-underline-offset:2px; padding:0;
  }
  .desc{ font-size:13.5px; color:var(--ink-soft); margin:0; white-space:pre-wrap; }
  .desc.empty{ color:#9AA69D; font-style:italic; }

  .seats-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:2px; }
  .seat-dots{ display:flex; flex-wrap:wrap; gap:4px; max-width:180px; }
  .seat-dot{ width:9px; height:9px; border-radius:50%; background:var(--line); flex-shrink:0; }
  .seat-dot.filled{ background: var(--dot-color, var(--moss)); }
  .seat-text{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; font-weight:600; color:var(--ink-soft); white-space:nowrap; }
  .seat-text.full{ color:var(--brick); }
  .seat-text.low{ color:var(--amber); }

  .card-actions{ display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .card-actions .btn{ flex:1; text-align:center; }

  .roster-toggle{
    font-size:12.5px; font-weight:700; color:var(--slate); background:none; border:none;
    padding:4px 0 0; text-align:left; display:flex; align-items:center; gap:5px;
  }
  .roster{
    display:none; border-top:1px dashed var(--line); margin-top:4px; padding-top:10px;
    flex-direction:column; gap:6px; max-height:220px; overflow-y:auto;
  }
  .roster.open{ display:flex; }
  .roster-empty{ font-size:12.5px; color:#9AA69D; font-style:italic; }
  .roster-row{
    display:flex; align-items:center; justify-content:space-between; font-size:13px;
    background:var(--paper); border-radius:8px; padding:6px 9px;
  }
  .roster-name{ font-weight:600; }
  .roster-phone{ font-family:'IBM Plex Mono', monospace; color:var(--slate); font-size:11.5px; margin-left:6px; }
  .pay-btn{
    font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; border:1.5px solid var(--line);
    background:#fff; color:var(--slate);
  }
  .pay-btn.paid{ border-color:var(--moss); background:var(--moss-tint); color:var(--moss-dark); }
  .pay-btn.unpaid{ border-color:var(--amber); background:var(--amber-tint); color:#8a611f; }

  /* ---------- Empty state ---------- */
  .empty-state{
    text-align:center; padding: 70px 20px; color:var(--slate);
  }
  .empty-state .glyph{ font-size:34px; margin-bottom:10px; }
  .empty-state h3{ font-family:'Noto Serif SC',serif; color:var(--ink); margin:0 0 6px; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(31,42,36,0.45); backdrop-filter: blur(2px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .modal{
    background:#fff; border-radius:18px; max-width:480px; width:100%;
    max-height:88vh; overflow-y:auto; padding:26px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal h2{ font-family:'Noto Serif SC', serif; margin:0 0 4px; font-size:21px; }
  .modal .sub{ color:var(--slate); font-size:13px; margin: 0 0 18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; font-weight:700; margin-bottom:5px; color:var(--ink-soft); }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border-radius:9px; border:1.5px solid var(--line);
    font-family:inherit; font-size:14px; background:var(--paper); color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .field-hint{ font-size:12px; color:var(--slate); margin-top:4px; }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .modal-actions .btn{ flex:1; text-align:center; }
  .modal-close{
    position:absolute; top:16px; right:16px; background:none; border:none; font-size:20px; color:var(--slate);
  }
  .modal{ position:relative; }
  .teacher-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .teacher-item{ background:var(--paper); border-radius:10px; padding:10px 12px; }
  .teacher-item-name{ font-weight:700; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:999px; font-size:13.5px;
    font-weight:600; opacity:0; pointer-events:none; transition: all .25s ease; z-index:200; box-shadow:var(--shadow);
    max-width: 90vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.err{ background:var(--brick); }

  @media (max-width:520px){
    .brand-name{ font-size:22px; }
    .field-row{ flex-direction:column; gap:0; }
    .card-actions{ flex-direction:column; }
    .card-actions .btn{ width:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">
        <span class="brand-mark">C</span>
        <span class="brand-name">ClassBoard</span>
        <span class="brand-sub">课程板</span>
      </div>
    </div>
    <div class="header-actions" id="headerActions"></div>
  </header>
  <p class="tagline">发布课程 · 家长报名 · 收款跟踪 — 一个链接搞定，不用下载 App，不用注册账号。</p>

  <div id="boardArea"></div>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
/* ======================= 状态 ======================= */
const ADMIN_PASSWORD = "1234";
const state = { courses: [], teachers: [], signups: [], loaded:false };
let isAdmin = false;
let openRosters = {}; // courseId -> bool, keep expanded state across re-render

/* ======================= 工具函数 ======================= */
function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function parseTime12(t){
  if(!t) return null;
  const m = String(t).trim().match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  let h = parseInt(m[1],10);
  const min = m[2];
  const period = h < 12 ? 'AM' : 'PM';
  let h12 = h % 12;
  if(h12 === 0) h12 = 12;
  return { h12, min, period };
}
function formatTimeRange(start, end){
  const s = parseTime12(start);
  const e = parseTime12(end);
  if(!s && !e) return '';
  if(s && !e) return `${s.h12}:${s.min} ${s.period}`;
  if(!s && e) return `${e.h12}:${e.min} ${e.period}`;
  if(s.period === e.period) return `${s.h12}:${s.min}\u2013${e.h12}:${e.min} ${e.period}`;
  return `${s.h12}:${s.min} ${s.period}\u2013${e.h12}:${e.min} ${e.period}`;
}
function toast(msg, isErr){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = isErr ? 'show err' : 'show';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> el.classList.remove('show'), 2600);
}
const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
function formatDateLabel(dateStr){
  if(!dateStr) return '未设置日期';
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return dateStr;
  return `${d.getMonth()+1}月${d.getDate()}日 ${WEEKDAYS[d.getDay()]}`;
}
function enrolledOf(courseId){
  return state.signups.filter(s=>s.courseId===courseId);
}

/* ======================= 存储层 ======================= */
async function safeGet(key){
  try{
    const r = await window.storage.get(key, true);
    return r ? r.value : null;
  }catch(e){ return null; }
}
async function loadData(){
  const ct = await safeGet('classboard-courses-teachers');
  if(ct){
    try{ const parsed = JSON.parse(ct); state.courses = parsed.courses||[]; state.teachers = parsed.teachers||[]; }
    catch(e){ state.courses=[]; state.teachers=[]; }
  }
  const su = await safeGet('classboard-signups');
  if(su){
    try{ state.signups = JSON.parse(su)||[]; }
    catch(e){ state.signups=[]; }
  }
  state.loaded = true;
}
async function saveCoursesTeachers(){
  try{
    const r = await window.storage.set('classboard-courses-teachers', JSON.stringify({courses:state.courses, teachers:state.teachers}), true);
    if(!r){ toast('保存失败，请检查网络后重试', true); return false; }
    return true;
  }catch(e){ toast('保存失败，请检查网络后重试', true); return false; }
}
async function saveSignups(){
  try{
    const r = await window.storage.set('classboard-signups', JSON.stringify(state.signups), true);
    if(!r){ toast('保存失败，请检查网络后重试', true); return false; }
    return true;
  }catch(e){ toast('保存失败，请检查网络后重试', true); return false; }
}

/* ======================= 渲染：头部操作区 ======================= */
function renderHeaderActions(){
  const el = document.getElementById('headerActions');
  if(isAdmin){
    el.innerHTML = `
      <span class="admin-pill"><span class="dot"></span>机构管理模式</span>
      <button class="btn btn-primary btn-sm" onclick="openCourseForm()">＋ 发布课程</button>
      <button class="btn btn-ghost btn-sm" onclick="openTeacherManage()">老师管理</button>
      <button class="btn btn-ghost btn-sm" onclick="exportExcel()">导出 Excel</button>
      <button class="btn btn-ghost btn-sm" onclick="exitAdmin()">退出管理</button>
    `;
  }else{
    el.innerHTML = `<button class="btn btn-sm" onclick="openPasswordModal()">机构管理</button>`;
  }
}

/* ======================= 渲染：课程板 ======================= */
function seatMeta(course){
  const enrolled = enrolledOf(course.id).length;
  const cap = Math.max(1, Number(course.capacity)||1);
  const remaining = cap - enrolled;
  let status = 'ok';
  if(remaining <= 0) status = 'full';
  else if(remaining / cap <= 0.3) status = 'low';
  return {enrolled, cap, remaining: Math.max(0,remaining), status};
}
function seatDotsHtml(meta){
  const colorVar = meta.status==='full' ? 'var(--brick)' : meta.status==='low' ? 'var(--amber)' : 'var(--moss)';
  if(meta.cap > 30){
    const pct = Math.min(100, Math.round((meta.enrolled/meta.cap)*100));
    return `<div style="width:120px;height:8px;border-radius:5px;background:var(--line);overflow:hidden;">
      <div style="width:${pct}%;height:100%;background:${colorVar};"></div></div>`;
  }
  let dots = '';
  for(let i=0;i<meta.cap;i++){
    dots += `<span class="seat-dot ${i<meta.enrolled?'filled':''}" style="--dot-color:${colorVar}"></span>`;
  }
  return `<div class="seat-dots">${dots}</div>`;
}
function courseCardHtml(course){
  const meta = seatMeta(course);
  const teacher = state.teachers.find(t=>t.id===course.teacherId);
  const accentColor = meta.status==='full' ? 'var(--brick)' : meta.status==='low' ? 'var(--amber)' : 'var(--moss)';
  const enrolledList = enrolledOf(course.id);
  const rosterOpen = !!openRosters[course.id];

  let rosterRows = '';
  if(enrolledList.length===0){
    rosterRows = `<div class="roster-empty">暂无学生报名</div>`;
  }else{
    rosterRows = enrolledList.map(s=>{
      if(isAdmin){
        return `<div class="roster-row">
          <span><span class="roster-name">${escapeHtml(s.studentName)}</span><span class="roster-phone">尾号${escapeHtml(s.phoneLast4)}</span></span>
          <button class="pay-btn ${s.paid?'paid':'unpaid'}" onclick="togglePaid('${s.id}')">${s.paid?'已收款':'待收款'}</button>
        </div>`;
      }
      return `<div class="roster-row"><span class="roster-name">${escapeHtml(s.studentName)}</span></div>`;
    }).join('');
  }

  const actionBtn = meta.status==='full'
    ? `<button class="btn btn-ghost" disabled>名额已满</button>`
    : `<button class="btn btn-primary" onclick="openSignupForm('${course.id}')">我要报名</button>`;

  const adminBtns = isAdmin ? `
      <button class="btn btn-ghost btn-sm" onclick="openCourseForm('${course.id}')">编辑</button>
      <button class="btn btn-danger btn-sm" onclick="deleteCourse('${course.id}')">删除</button>
  ` : '';

  return `
  <div class="card" style="--card-accent:${accentColor}">
    <div class="badges">
      <span class="badge time">🕐 ${course.date? formatDateLabel(course.date)+' · ':''}${formatTimeRange(course.startTime, course.endTime) || '时间待定'}</span>
      <span class="badge grade">🎓 ${course.grade? escapeHtml(course.grade) : '年级未设置'}</span>
    </div>
    <h3 class="course-name">${escapeHtml(course.name||'未命名课程')}</h3>
    <p class="teacher-line">👤 <b>${teacher? escapeHtml(teacher.name) : '未指定老师'}</b>
      ${teacher && teacher.bio ? `<button class="link-btn" onclick="showTeacherBio('${teacher.id}')">简介</button>` : ''}
    </p>
    <p class="desc ${course.description?'':'empty'}">${course.description? escapeHtml(course.description) : '机构还没有填写课程简介'}</p>
    <div class="seats-row">
      ${seatDotsHtml(meta)}
      <span class="seat-text ${meta.status}">${meta.status==='full' ? '名额已满' : `剩余 ${meta.remaining} / ${meta.cap}`}</span>
    </div>
    <button class="roster-toggle" onclick="toggleRoster('${course.id}')">${rosterOpen?'收起':'查看'}报名名单（${enrolledList.length}人） ${rosterOpen?'▲':'▼'}</button>
    <div class="roster ${rosterOpen?'open':''}" id="roster-${course.id}">${rosterRows}</div>
    <div class="card-actions">${actionBtn}${adminBtns}</div>
  </div>`;
}

function renderBoard(){
  const el = document.getElementById('boardArea');
  if(!state.loaded){
    el.innerHTML = `<div class="empty-state"><div class="glyph">⏳</div><p>正在加载课程板…</p></div>`;
    return;
  }
  if(state.courses.length===0){
    el.innerHTML = `<div class="empty-state">
      <div class="glyph">🗓️</div>
      <h3>还没有发布任何课程</h3>
      <p>${isAdmin ? '点击右上角「＋ 发布课程」，发布第一门课吧' : '机构还没有开放报名，请稍后再来看看'}</p>
    </div>`;
    return;
  }
  const groups = {};
  state.courses.forEach(c=>{
    const key = c.date || '未设置日期';
    (groups[key] = groups[key] || []).push(c);
  });
  const sortedDates = Object.keys(groups).sort((a,b)=> a.localeCompare(b));
  let html = '';
  sortedDates.forEach(date=>{
    const courses = groups[date].sort((a,b)=> (a.startTime||'').localeCompare(b.startTime||''));
    html += `<div class="date-divider"><span class="date-label">${formatDateLabel(date)}</span><span class="date-line"></span></div>`;
    html += `<div class="grid">${courses.map(courseCardHtml).join('')}</div>`;
  });
  el.innerHTML = html;
}

function toggleRoster(courseId){
  openRosters[courseId] = !openRosters[courseId];
  renderBoard();
}

async function togglePaid(signupId){
  const s = state.signups.find(x=>x.id===signupId);
  if(!s) return;
  s.paid = !s.paid;
  renderBoard();
  const ok = await saveSignups();
  if(ok) toast(s.paid? '已标记为已收款' : '已标记为待收款');
}

/* ======================= 弹窗基础 ======================= */
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openModal(inner){
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="modal-close" onclick="closeModal()" aria-label="关闭">✕</button>
        ${inner}
      </div>
    </div>`;
}

/* ======================= 管理员登录 ======================= */
function openPasswordModal(){
  openModal(`
    <h2>机构管理</h2>
    <p class="sub">输入管理密码以解锁课程发布、收款跟踪与数据导出</p>
    <div class="field">
      <label for="pwInput">管理密码</label>
      <input type="password" id="pwInput" placeholder="请输入密码" autofocus>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitPassword()">解锁</button>
    </div>
  `);
  setTimeout(()=>{
    const inp = document.getElementById('pwInput');
    inp && inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submitPassword(); });
  },0);
}
function submitPassword(){
  const val = document.getElementById('pwInput').value;
  if(val === ADMIN_PASSWORD){
    isAdmin = true;
    closeModal();
    renderHeaderActions();
    renderBoard();
    toast('已解锁机构管理');
  }else{
    toast('密码不正确', true);
  }
}
function exitAdmin(){
  isAdmin = false;
  renderHeaderActions();
  renderBoard();
  toast('已退出管理模式');
}

/* ======================= 老师简介弹窗（家长视角） ======================= */
function showTeacherBio(teacherId){
  const t = state.teachers.find(x=>x.id===teacherId);
  if(!t) return;
  openModal(`
    <h2>${escapeHtml(t.name)}</h2>
    <p class="sub">老师简介</p>
    <p style="white-space:pre-wrap;font-size:14px;">${t.bio? escapeHtml(t.bio) : '这位老师还没有填写简介。'}</p>
    <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">知道了</button></div>
  `);
}

/* ======================= 家长报名 ======================= */
function openSignupForm(courseId){
  const course = state.courses.find(c=>c.id===courseId);
  if(!course) return;
  openModal(`
    <h2>报名：${escapeHtml(course.name)}</h2>
    <p class="sub">${formatDateLabel(course.date)} · ${formatTimeRange(course.startTime, course.endTime)}</p>
    <div class="field">
      <label for="suName">孩子姓名</label>
      <input type="text" id="suName" placeholder="请输入孩子姓名">
    </div>
    <div class="field">
      <label for="suPhone">家长手机号后四位</label>
      <input type="text" id="suPhone" maxlength="4" inputmode="numeric" placeholder="用于核对身份和收款">
      <div class="field-hint">仅用于机构核对身份，不会展示给其他家长</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitSignup('${courseId}')">提交报名</button>
    </div>
  `);
}
async function submitSignup(courseId){
  const name = document.getElementById('suName').value.trim();
  const phone = document.getElementById('suPhone').value.trim();
  if(!name){ toast('请填写孩子姓名', true); return; }
  if(!/^\d{4}$/.test(phone)){ toast('请输入手机号后四位数字', true); return; }

  // 重新拉取最新报名数据，减少并发抢占名额的误差
  const su = await safeGet('classboard-signups');
  if(su){ try{ state.signups = JSON.parse(su)||[]; }catch(e){} }

  const course = state.courses.find(c=>c.id===courseId);
  const meta = seatMeta(course);
  if(meta.status==='full'){
    toast('抱歉，该课程名额已满', true);
    renderBoard();
    closeModal();
    return;
  }
  state.signups.push({ id: uid(), courseId, studentName:name, phoneLast4:phone, paid:false, ts: Date.now() });
  closeModal();
  openRosters[courseId] = true;
  renderBoard();
  const ok = await saveSignups();
  if(ok) toast('报名成功！可在课程卡片下方查看名单');
}

/* ======================= 机构：课程表单 ======================= */
function timeSelectHtml(idPrefix, currentValue){
  const parts = (currentValue||'').match(/^(\d{1,2}):(\d{2})$/);
  const curH = parts ? parts[1].padStart(2,'0') : '';
  const curM = parts ? parts[2] : '';
  let hourOpts = `<option value="">时</option>`;
  for(let h=0; h<24; h++){
    const hh = String(h).padStart(2,'0');
    hourOpts += `<option value="${hh}" ${hh===curH?'selected':''}>${hh}</option>`;
  }
  let minOpts = `<option value="">分</option>`;
  for(let m=0; m<60; m+=5){
    const mm = String(m).padStart(2,'0');
    minOpts += `<option value="${mm}" ${mm===curM?'selected':''}>${mm}</option>`;
  }
  return `<div style="display:flex;align-items:center;gap:6px;">
    <select id="${idPrefix}H" style="flex:1;">${hourOpts}</select>
    <span style="color:var(--slate);font-weight:700;">:</span>
    <select id="${idPrefix}M" style="flex:1;">${minOpts}</select>
  </div>`;
}
function readTimeSelect(idPrefix){
  const h = document.getElementById(idPrefix+'H').value;
  const m = document.getElementById(idPrefix+'M').value;
  if(!h || !m) return '';
  return `${h}:${m}`;
}
function teacherOptionsHtml(selectedId){
  return state.teachers.map(t=>`<option value="${t.id}" ${t.id===selectedId?'selected':''}>${escapeHtml(t.name)}</option>`).join('');
}
function openCourseForm(courseId){
  const editing = !!courseId;
  const course = editing ? state.courses.find(c=>c.id===courseId) : {};
  openModal(`
    <h2>${editing?'编辑课程':'发布课程'}</h2>
    <p class="sub">${editing?'修改内容后立即生效':'填写课程信息，发布后家长即可报名'}</p>
    <div class="field">
      <label for="cfName">课程名称</label>
      <input type="text" id="cfName" value="${editing?escapeHtml(course.name||''):''}" placeholder="例如：跳绳强化班">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="cfDate">上课日期</label>
        <input type="date" id="cfDate" value="${editing?escapeHtml(course.date||''):''}">
      </div>
      <div class="field">
        <label for="cfGrade">适合年级</label>
        <input type="text" id="cfGrade" value="${editing?escapeHtml(course.grade||''):''}" placeholder="例如：三年级">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="cfStartH">开始时间</label>
        ${timeSelectHtml('cfStart', editing?course.startTime:'')}
      </div>
      <div class="field">
        <label for="cfEndH">结束时间</label>
        ${timeSelectHtml('cfEnd', editing?course.endTime:'')}
      </div>
    </div>
    <div class="field">
      <label for="cfTeacher">任课老师</label>
      <select id="cfTeacher">
        <option value="">未指定</option>
        ${teacherOptionsHtml(editing?course.teacherId:null)}
      </select>
      <div class="field-hint">没有想要的老师？先关闭此窗口，去「老师管理」新增</div>
    </div>
    <div class="field">
      <label for="cfCap">名额上限</label>
      <input type="number" id="cfCap" min="1" value="${editing?(course.capacity||10):10}">
    </div>
    <div class="field">
      <label for="cfDesc">课程简介</label>
      <textarea id="cfDesc" placeholder="教学内容、适合人群等说明">${editing?escapeHtml(course.description||''):''}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitCourseForm(${editing?`'${courseId}'`:'null'})">${editing?'保存修改':'发布课程'}</button>
    </div>
  `);
}
async function submitCourseForm(courseId){
  const name = document.getElementById('cfName').value.trim();
  const date = document.getElementById('cfDate').value;
  const grade = document.getElementById('cfGrade').value.trim();
  const startTime = readTimeSelect('cfStart');
  const endTime = readTimeSelect('cfEnd');
  const teacherId = document.getElementById('cfTeacher').value;
  const capacity = Math.max(1, parseInt(document.getElementById('cfCap').value)||1);
  const description = document.getElementById('cfDesc').value.trim();

  if(!name){ toast('请填写课程名称', true); return; }
  if(!date){ toast('请选择上课日期', true); return; }

  if(courseId){
    const c = state.courses.find(x=>x.id===courseId);
    Object.assign(c, {name,date,grade,startTime,endTime,teacherId,capacity,description});
  }else{
    state.courses.push({ id: uid(), name,date,grade,startTime,endTime,teacherId,capacity,description });
  }
  closeModal();
  renderBoard();
  const ok = await saveCoursesTeachers();
  if(ok) toast(courseId? '课程已更新' : '课程已发布');
}
async function deleteCourse(courseId){
  const related = enrolledOf(courseId).length;
  const msg = related>0
    ? `该课程已有 ${related} 条报名记录，删除后这些记录也会一并删除，确定删除吗？`
    : '确定要删除这门课程吗？';
  if(!confirm(msg)) return;
  state.courses = state.courses.filter(c=>c.id!==courseId);
  state.signups = state.signups.filter(s=>s.courseId!==courseId);
  renderBoard();
  await saveCoursesTeachers();
  await saveSignups();
  toast('课程已删除');
}

/* ======================= 机构：老师管理 ======================= */
function openTeacherManage(){
  renderTeacherManageModal();
}
function renderTeacherManageModal(){
  const list = state.teachers.map(t=>`
    <div class="teacher-item">
      <div class="teacher-item-name">
        <input type="text" value="${escapeHtml(t.name)}" style="border:none;background:none;font-weight:700;font-size:14px;padding:0;width:60%;" onchange="updateTeacherField('${t.id}','name',this.value)">
        <button class="btn btn-danger btn-sm" onclick="deleteTeacher('${t.id}')">删除</button>
      </div>
      <textarea placeholder="教龄、擅长方向等介绍" onchange="updateTeacherField('${t.id}','bio',this.value)" style="width:100%;border:1.5px solid var(--line);border-radius:8px;padding:8px;font-size:13px;min-height:50px;font-family:inherit;">${escapeHtml(t.bio||'')}</textarea>
    </div>
  `).join('') || `<p class="field-hint">还没有添加老师</p>`;

  openModal(`
    <h2>老师管理</h2>
    <p class="sub">老师简介会自动显示在对应课程卡片上</p>
    <div class="teacher-list">${list}</div>
    <div class="field">
      <label for="newTeacherName">新增老师</label>
      <input type="text" id="newTeacherName" placeholder="老师姓名">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
      <button class="btn btn-primary" onclick="addTeacher()">＋ 添加</button>
    </div>
  `);
}
async function addTeacher(){
  const name = document.getElementById('newTeacherName').value.trim();
  if(!name){ toast('请填写老师姓名', true); return; }
  state.teachers.push({ id: uid(), name, bio:'' });
  await saveCoursesTeachers();
  renderTeacherManageModal();
  renderBoard();
  toast('老师已添加');
}
async function updateTeacherField(teacherId, field, value){
  const t = state.teachers.find(x=>x.id===teacherId);
  if(!t) return;
  t[field] = value.trim();
  const ok = await saveCoursesTeachers();
  renderBoard();
  if(ok) toast('已保存');
}
async function deleteTeacher(teacherId){
  const used = state.courses.some(c=>c.teacherId===teacherId);
  if(used && !confirm('有课程正在使用这位老师，删除后对应课程会显示"未指定老师"，确定删除吗？')) return;
  state.teachers = state.teachers.filter(t=>t.id!==teacherId);
  state.courses.forEach(c=>{ if(c.teacherId===teacherId) c.teacherId=''; });
  await saveCoursesTeachers();
  renderTeacherManageModal();
  renderBoard();
  toast('老师已删除');
}

/* ======================= 机构：导出 Excel ======================= */
function exportExcel(){
  if(typeof XLSX === 'undefined'){ toast('导出组件加载失败，请检查网络', true); return; }
  if(state.courses.length===0){ toast('还没有课程数据可导出', true); return; }

  const teacherName = id => (state.teachers.find(t=>t.id===id)||{}).name || '未指定';

  // 1. 报名明细
  const detail = [['课程名称','上课日期','上课时间','学生姓名','家长手机尾号','付款状态','报名时间']];
  state.signups.forEach(s=>{
    const c = state.courses.find(c=>c.id===s.courseId);
    detail.push([
      c? c.name : '（课程已删除）',
      c? c.date : '',
      c? formatTimeRange(c.startTime, c.endTime) : '',
      s.studentName, s.phoneLast4, s.paid?'已收款':'待收款',
      new Date(s.ts).toLocaleString('zh-CN')
    ]);
  });

  // 2. 各时段人数 & 剩余名额 & 报满率
  const summary = [['日期','时间','课程名称','老师','已报名','名额上限','剩余名额','报满率']];
  state.courses.forEach(c=>{
    const meta = seatMeta(c);
    summary.push([c.date, formatTimeRange(c.startTime, c.endTime), c.name, teacherName(c.teacherId),
      meta.enrolled, meta.cap, meta.remaining, `${Math.round((meta.enrolled/meta.cap)*100)}%`]);
  });

  // 3. 老师带课统计
  const teacherStats = {};
  state.courses.forEach(c=>{
    const name = teacherName(c.teacherId);
    if(!teacherStats[name]) teacherStats[name] = {courses:0, students:0};
    teacherStats[name].courses += 1;
    teacherStats[name].students += enrolledOf(c.id).length;
  });
  const teacherSheet = [['老师','带课数','学生总数']];
  Object.keys(teacherStats).forEach(name=>{
    teacherSheet.push([name, teacherStats[name].courses, teacherStats[name].students]);
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(detail), '报名明细');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), '各时段与报满率');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(teacherSheet), '老师带课统计');

  const dateStr = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `ClassBoard报名统计_${dateStr}.xlsx`);
  toast('已导出 Excel');
}

/* ======================= 初始化 & 轮询刷新 ======================= */
async function init(){
  renderHeaderActions();
  renderBoard();
  await loadData();
  renderBoard();
  setInterval(async ()=>{
    if(document.getElementById('modalRoot').innerHTML.trim() !== '') return; // 弹窗打开时不刷新，避免打断输入
    await loadData();
    renderBoard();
  }, 8000);
}
init();
</script>
