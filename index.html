<style>
  :root{
    /* 中性灰白页面底色：减少大面积米色，仅在交替课程卡保留少量暖色 */
    --ink:#1F2A24;
    --ink-soft:#3A453F;
    --paper:#F3F4F2;
    --paper-deep:#E9ECE8;
    --card:#FFFFFF;
    --moss:#3F6B52;
    --moss-dark:#2C4C3B;
    --moss-tint:#E3EDE5;
    --amber:#C98A2C;
    --amber-tint:#FBF1DF;
    /* 名额紧张：低饱和灰绿色，轻微提醒但不制造焦虑 */
    --low:#748174;
    --low-tint:#EEF1EC;
    --full:#A3A79F;
    --full-tint:#F5F5F2;
    --brick:#81524C;
    --brick-tint:#F7E7E5;
    --slate:#5B6B63;
    --line:#D8DDD9;
    --radius:14px;
    --shadow: 0 1px 2px rgba(31,42,36,0.06), 0 6px 20px rgba(31,42,36,0.05);
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color: transparent;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans SC', system-ui, -apple-system, sans-serif;
    font-weight:400;
    font-size:15px;
    line-height:1.65;
    letter-spacing:0.1px;
    min-height:100vh;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(31,42,36,0.018) 1px, transparent 1.4px);
    background-size: 30px 30px;
  }
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{ background: var(--moss-tint); }
  :focus-visible{ outline: 2.5px solid var(--moss); outline-offset: 2px; }

  .wrap{ max-width: 1080px; margin: 0 auto; padding: 20px 20px 80px; }

  header{
    display:flex; flex-direction:column; gap:12px; padding-top: 8px;
  }
  .header-top{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:baseline; gap:11px; }
  .admin-entry-btn{
    display:inline-flex; align-items:center; gap:6px; flex-shrink:0; cursor:pointer;
    background:var(--moss-tint); border:1px solid rgba(63,107,82,0.25); color:var(--moss-dark);
    font-size:13px; font-weight:700; padding:7px 14px 7px 12px; border-radius:999px;
    transition: background .15s ease, color .15s ease, transform .12s ease;
  }
  .admin-entry-btn:hover{ background:var(--moss); color:#fff; transform:translateY(-1px); }
  .brand-mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px; border-radius:10px;
    background: linear-gradient(155deg, var(--moss), var(--moss-dark)); color:#fff; font-family:'Baloo 2', 'ZCOOL KuaiLe', sans-serif;
    font-weight:900; font-size:17px; flex-shrink:0; box-shadow:0 3px 8px rgba(44,76,59,0.28);
  }
  .brand-name{ font-family:'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight:900; font-size:27px; letter-spacing:0.3px; }
  .brand-sub{ font-size:13.5px; color:var(--slate); font-weight:500; letter-spacing:0.3px; }
  .tagline{ margin: 6px 0 26px; color:var(--slate); font-size:14px; }

  .seed-notice{
    background:var(--moss-tint); border:1px solid rgba(63,107,82,0.16); border-radius:12px;
    padding:11px 16px; margin-bottom:18px; font-size:12.5px; color:var(--moss-dark); line-height:1.6;
    box-shadow:var(--shadow);
  }

  .header-actions{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    padding-top:11px; border-top:1px dashed var(--line);
  }
  .header-actions:empty{ display:none; }
  .btn{
    border:1.5px solid var(--ink); background:var(--card); color:var(--ink);
    padding:9px 17px; border-radius:999px; font-size:13.5px; font-weight:700;
    letter-spacing:0.2px;
    transition: transform .12s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .btn:hover{ transform: translateY(-1px); box-shadow:0 4px 10px rgba(31,42,36,0.1); }
  .btn:active{ transform: translateY(0); box-shadow:none; }
  .btn-primary{ background:var(--moss); border-color:var(--moss); color:#fff; }
  .btn-primary:hover{ background:var(--moss-dark); }
  .btn-ghost{ border-color:var(--line); }
  .btn-danger{ border-color:var(--brick); color:var(--brick); background:#fff; }
  .btn-danger:hover{ background:var(--brick-tint); }
  .btn-sm{ padding:6px 12px; font-size:13px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }

  .admin-pill{
    display:flex; align-items:center; gap:8px; background:var(--moss-tint);
    border:1px solid var(--moss); color:var(--moss-dark); font-size:13px; font-weight:700;
    padding:7px 12px 7px 10px; border-radius:999px;
  }
  .admin-pill .dot{ width:7px; height:7px; border-radius:50%; background:var(--moss); display:inline-block; }

  .date-divider{
    display:flex; align-items:center; gap:12px; margin: 34px 0 16px;
  }
  .date-divider:first-of-type{ margin-top: 18px; }
  .date-label{
    font-family:'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight:700; font-size:15.5px; letter-spacing:0.3px;
    background:var(--ink); color:var(--paper); padding:6px 15px 6px 13px;
    border-radius: 3px 10px 10px 3px; position:relative;
  }
  .date-label::before{
    content:''; position:absolute; left:-6px; top:50%; transform:translateY(-50%);
    width:6px; height:6px; border-radius:50%; background:#5B6B63;
    box-shadow: 0 0 0 2px var(--paper);
  }
  .date-line{ flex:1; height:1px; background: var(--line); }

  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:18px; }

  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    border:1px solid rgba(220,213,192,.88); padding:0; display:flex; flex-direction:column; gap:0;
    position:relative; overflow:hidden;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  /* 同一位老师名下课程使用极轻的白色 / 暖米色交替，
     保持统一绿色品牌体系，只靠课程底色区分相邻课程 */
  .card.course-alt{
    background:#FBF8F1;
  }
  .card.course-alt .roster-preview{
    background:#FBF8F1;
  }
  .card.course-alt .core-meta,
  .card.course-alt .details-trigger{
    background:rgba(246,241,231,.78);
  }
  .card.course-alt .details-trigger:hover{
    background:rgba(242,236,224,.9);
  }
  .card:hover{
    transform: translateY(-2px);
    box-shadow: 0 2px 4px rgba(31,42,36,0.07), 0 12px 28px rgba(31,42,36,0.09);
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; width:5px; height:100%; background: var(--card-accent, var(--moss));
  }
  .course-name{
    font-family:'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight:700; font-size:23px; margin:0;
    letter-spacing:0.1px; line-height:1.22; color:var(--ink);
  }

  /* 移动端先展示课程、时间、状态三项核心信息 */
  .course-summary{ padding:20px 20px 16px 24px; cursor:pointer; }
  .course-summary:hover{ background:rgba(227,237,229,.25); }
  .course-summary-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
  .course-title-wrap{ min-width:0; }
  .course-teacher-label{
    display:inline-flex; align-items:center; margin-top:0; color:var(--moss-dark);
    font-size:11.5px; font-weight:500; line-height:1.15; letter-spacing:.1px;
  }
  .status-badge{
    flex-shrink:0; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700;
    color:var(--status-color); background:var(--status-bg, var(--moss-tint));
  }
  .course-signup-btn{
    flex-shrink:0; min-height:38px; padding:7px 14px; border:0; border-radius:10px;
    background:var(--moss); color:#fff; font-size:13px; font-weight:700; white-space:nowrap;
    box-shadow:0 2px 6px rgba(44,76,59,.14);
  }
  .course-signup-btn:hover{ background:var(--moss-dark); }
  .course-signup-btn:disabled{ background:var(--full-tint); color:var(--full); box-shadow:none; cursor:not-allowed; }
  /* 课程卡统一文字系统：区域标题统一；正文/数字统一，颜色保持各自语义 */
  .top-signup-stack{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
  .top-seat-note{ color:var(--slate); font-size:13px; font-weight:400; line-height:1.45; letter-spacing:.05px; white-space:nowrap; }

  /* 上课时间：作为独立区域，使用极浅暖底色；不加圆角，降低“卡片套卡片”感 */
  .core-meta{
    /* 与正文左右边缘完全对齐：底色、分隔线、文字使用同一宽度 */
    margin:13px 0 -16px 0; padding:11px 0 12px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:14px;
    background:rgba(247,244,236,.55);
  }
  .core-time{ min-width:0; }
  .core-time-label{ display:block; color:var(--moss-dark); font-size:13px; font-weight:700; line-height:1.35; letter-spacing:.05px; margin-bottom:3px; }
  .core-date, .core-clock{ font-size:13px; font-weight:400; line-height:1.45; letter-spacing:.05px; }
  .core-date{ display:block; color:var(--ink); }
  .core-clock{ display:block; color:var(--ink-soft); margin-top:0; }
  .core-seat{ color:var(--status-color); font-size:13px; font-weight:400; line-height:1.45; letter-spacing:.05px; white-space:nowrap; }

  /* 查看课程详情：与其它区域标题统一字号/字重/颜色；背景采用交替浅底色 */
  .details-trigger{
    /* 不再 width:100% 撑到卡片边缘；和上方正文/底色块同宽，避免第三块“出框” */
    position:relative; width:auto; border:0; border-top:1px solid rgba(220,213,192,.72); border-radius:0;
    background:rgba(247,244,236,.55); color:var(--moss-dark);
    display:flex; align-items:center; justify-content:space-between;
    margin:0 20px 0 24px; padding:11px 0;
    font-size:13px; font-weight:700; line-height:1.35; letter-spacing:.05px; text-align:left;
  }
  .details-trigger::before{ content:none; }
  .details-trigger:hover{ background:rgba(247,244,236,.72); }
  .details-trigger .chev{ font-size:18px; line-height:1; transition:transform .2s ease; }
  .details-trigger.open .chev{ transform:rotate(90deg); }
  .course-details{ display:none; padding:4px 20px 20px 24px; }
  .course-details.expanded{ display:block; animation:detailsIn .2s ease; }
  @keyframes detailsIn{ from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
  .detail-meta{ display:flex; gap:18px; flex-wrap:wrap; padding:12px 0; border-bottom:1px solid var(--line); }
  .detail-meta-item{ display:flex; flex-direction:column; gap:1px; }
  .detail-meta-label{ color:var(--slate); font-size:11px; }
  .detail-meta-value{ color:var(--ink); font-size:13px; font-weight:600; }
  .detail-section{ padding-top:14px; }
  .detail-section-title{ margin:0 0 7px; font-size:13px; font-weight:700; line-height:1.35; letter-spacing:.05px; color:var(--moss-dark); }
  .course-description{ margin:0; color:var(--ink-soft); font-size:13px; font-weight:400; line-height:1.45; letter-spacing:.05px; white-space:pre-wrap; }

  /* 报名名单：白底，与“上课时间 / 查看课程详情”的浅底交替 */
  .roster-preview{
    /* 报名区也与正文宽度一致；横线直接成为底色块上边界，避免“线和底色错位” */
    margin:0 20px 0 24px; padding:10px 0; background:var(--card);
    border-top:1px solid rgba(220,213,192,.72);
  }
  .roster-preview::before{ content:none; }
  .roster-preview .detail-section-title{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;
    font-size:13px; font-weight:700; line-height:1.35; letter-spacing:.05px; color:var(--moss-dark);
  }
  .roster-count{ color:var(--slate); font-size:13px; font-weight:400; line-height:1.45; letter-spacing:.05px; }
  .card > .card-actions{ padding:0 20px 20px 24px; margin-top:0; }
  .card > .card-actions:empty{ display:none; padding:0; margin:0; }
  .card > .details-trigger:last-of-type{ margin-bottom:0; }

  /* 信息方块：上课时间 / 年级 / 剩余名额 — 各自独立浅色区块，参考报名系统的工整卡片风格 */
  .info-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(84px, 1fr));
    background:rgba(63,107,82,0.22); border:1px solid rgba(63,107,82,0.22); border-radius:12px;
    gap:1px; overflow:hidden;
  }
  .info-cell{
    background:var(--moss-tint); padding:9px 11px 10px; display:flex; flex-direction:column; gap:3px; min-width:0;
  }
  .info-label{
    font-size:10.5px; font-weight:600; color:var(--slate); letter-spacing:0.2px;
    display:flex; align-items:center; gap:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .info-value{
    font-size:13px; font-weight:700; color:var(--ink); line-height:1.35; letter-spacing:0.1px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .info-value-sub{ font-weight:600; color:var(--ink-soft); font-size:12px; }
  .info-value.seat-full{ color:var(--brick); }
  .info-value.seat-low{ color:var(--amber); }
  .info-cell .seat-dots{ margin-top:2px; }

  /* 课程简介：独立浅色区块 */
  .desc-block{
    background:var(--moss-tint); border:1px solid rgba(63,107,82,0.18); border-radius:12px; padding:11px 13px;
  }
  .desc-header{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .desc-avatar{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(155deg, var(--moss), var(--moss-dark)); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight:800; font-size:13px;
  }
  .desc-label{ font-size:13.5px; font-weight:700; color:var(--ink); letter-spacing:0.1px; flex:1; }
  .desc-wrap{ display:flex; flex-direction:column; gap:4px; }
  .desc{
    font-size:13.5px; color:var(--ink-soft); margin:0; white-space:pre-wrap;
    line-height:1.6; letter-spacing:0.1px;
    display:none;
  }
  .desc.expanded{ display:block; }
  .desc.empty{ color:#9AA69D; font-style:italic; display:block; }
  .desc-toggle{
    background:none; border:none; padding:0; margin:0; flex-shrink:0;
    font-size:12px; font-weight:700; color:var(--moss); cursor:pointer;
    display:none; align-items:center; gap:3px;
  }
  .desc-toggle:hover{ color:var(--moss-dark); }
  .desc-toggle.visible{ display:inline-flex; }
  .desc-toggle .label{ text-decoration:underline; text-underline-offset:2px; }
  .desc-toggle .chev{ font-size:12px; display:inline-block; }

  /* 授课老师：独立浅色区块，头像 + 姓名 */
  .teacher-block{
    display:flex; align-items:center; gap:10px;
    background:var(--moss-tint); border:1px solid rgba(63,107,82,0.18); border-radius:12px;
    padding:9px 13px;
  }
  .teacher-avatar{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(155deg, var(--moss), var(--moss-dark)); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight:800; font-size:13px;
  }
  .teacher-meta{ display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
  .teacher-name{ font-size:13.5px; font-weight:700; color:var(--ink); letter-spacing:0.1px; }
  .teacher-role{ font-size:13.5px; font-weight:700; color:var(--ink); letter-spacing:0.1px; }
  .link-btn{
    background:none; border:none; color:var(--moss); font-size:12px; font-weight:700;
    padding:0; flex-shrink:0; display:inline-flex; align-items:center; gap:3px;
  }
  .link-btn .label{ text-decoration:underline; text-underline-offset:2px; }
  .link-btn .chev{ font-size:12px; display:inline-block; }

  .card-teacher-tag{
    display:flex; align-items:center; gap:6px; margin-bottom:8px;
  }
  .card-teacher-tag .mini-avatar{
    width:18px; height:18px; border-radius:50%; background:var(--moss-tint);
    display:flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0;
  }
  .card-teacher-tag .mini-name{
    font-size:12px; font-weight:700; color:var(--moss-dark); letter-spacing:0.1px;
  }

  .fee-list{ display:flex; flex-direction:column; gap:5px; }
  .fee-line{
    position:relative; padding-left:14px; font-size:13px; color:var(--ink-soft);
    line-height:1.5; letter-spacing:0.1px;
  }
  .fee-line::before{
    content:''; position:absolute; left:1px; top:7px; width:5px; height:5px; border-radius:50%;
    background:var(--amber);
  }

  /* 老师 + 该老师名下课程 合并为一个整体分组容器：
     深色老师头卡在上（不再有自己的圆角/阴影/margin），下方课程网格共用同一个浅色底盒，
     视觉上连成一体，避免老师区块和课程卡片"各自为政"的割裂感 */
  .teacher-group{
    background:#ECEFEB; border-radius:18px; overflow:hidden;
    border: 1px solid var(--line); box-shadow: var(--shadow);
    margin: 34px 0 20px;
  }
  .teacher-group:first-of-type{ margin-top: 18px; }
  .teacher-group-body{ padding: 16px 16px 18px; }
  .teacher-group-body .grid{ margin:0; gap:8px; }

<body>
<div class="wrap">
  <header>
    <div class="header-top">
      <div class="brand">
        <span class="brand-mark" id="brandMark">C</span>
        <span class="brand-name" id="brandTitle">ClassBoard</span>
        <span class="brand-sub">课程板</span>
      </div>
      <div id="headerEntry"></div>
    </div>
    <div class="header-actions" id="headerActions"></div>
  </header>
  <div id="boardArea"></div>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
const ADMIN_PASSWORD = "1234";
// 从网址参数里读取机构标识，例如 ?org=katy —— 不同机构用不同的 org 参数，
// 数据会各自独立存储，互不影响。没带参数时用 "main_data"，兼容之前已有的数据。
const ORG_ID = (new URLSearchParams(window.location.search).get('org') || 'main_data').trim() || 'main_data';
const SHARE_TEACHER_ID = (new URLSearchParams(window.location.search).get('teacher') || '').trim();
const state = { courses: [], teachers: [], signups: [], feePlans: [], settings: { orgName: "ClassBoard", showPaymentStatusPublic:false }, loaded:false };
let isAdmin = false;
let openRosters = {};
let expandedDescs = {};
let expandedFees = {};
let expandedTeacherBios = {};
let expandedTeacherFees = {};

/* 首个访问、云端还没有任何数据时使用的示例模板，避免首页一片空白。
   管理员可以直接在「机构管理」里编辑或删除这门课，改成自己的真实课程即可。 */
function templateSeedData(){
  const teacherId = 'seed-teacher-erin';
  const courseId = 'seed-course-math';
  const d = new Date();
  d.setDate(d.getDate() + 7);
  const dateStr = d.toISOString().slice(0,10);
  return {
    courses: [{
      id: courseId,
      name: '数学试课',
      date: dateStr,
      grade: '一至三年级',
      startTime: '09:00',
      endTime: '10:00',
      teacherId: teacherId,
      feePlanId: 'seed-plan-default',
      capacity: 4,
      description: 'Ms. Erin 拥有10年以上少儿教育经验，擅长用引导式提问带动孩子独立思考，帮助建立数感与逻辑思维习惯。本次试课从生活情境切入，让孩子在轻松的氛围中体验数学的乐趣，欢迎家长陪同试听。'
    }],
    teachers: [{
      id: teacherId,
      name: 'Ms. Erin',
      bio: '10年以上少儿数学与思维教学经验，擅长思维引导式教学，课堂氛围轻松有趣，深受学生和家长喜爱。',
      feeNotice: '单次试课 100 元，正式课 150 元/次，报名后请添加老师微信付款'
    }],
    feePlans: [{
      id: 'seed-plan-default',
      name: '标准收费',
      text: '单次试课 100 元，正式课 150 元/次，报名后请添加老师微信付款'
    }],
    signups: [],
    settings: { orgName: "ClassBoard", showPaymentStatusPublic:false }
  };
}

function initFirebaseSync(){
  const db = window.firebaseDb;
  const { doc, onSnapshot } = window.FirebaseSdk;

  onSnapshot(doc(db, "classboard", ORG_ID), (docSnap) => {
    if (docSnap.exists()) {
      const data = docSnap.data();
      state.courses = data.courses || [];
      state.teachers = data.teachers || [];
      state.signups = data.signups || [];
      state.feePlans = data.feePlans || [];
      state.settings = { orgName: "ClassBoard", showPaymentStatusPublic:false, ...(data.settings || {}) };
    } else {
      const seed = templateSeedData();
      state.courses = seed.courses;
      state.teachers = seed.teachers;
      state.signups = seed.signups;
      state.feePlans = seed.feePlans;
      state.settings = seed.settings;
    }
    state.loaded = true;
    state.offline = false;
    renderBrand();
    renderBoard();
    renderHeaderActions();
  }, (error) => {
    console.error("Firebase 监听失败:", error);
    toast("数据同步异常，请检查网络", true);
  });
}

async function syncToCloud(){
  try {
    const db = window.firebaseDb;
    const { doc, setDoc } = window.FirebaseSdk;
    await setDoc(doc(db, "classboard", ORG_ID), {
      courses: state.courses,
      teachers: state.teachers,
      signups: state.signups,
      feePlans: state.feePlans,
      settings: state.settings
    });
    return true;
  } catch(e) {
    console.error("同步云端失败:", e);
    toast('保存失败，请检查网络后重试', true);
    return false;
  }
}

function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function parseTime12(t){
  if(!t) return null;
  const m = String(t).trim().match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  let h = parseInt(m[1],10);
  const min = m[2];
  const period = h < 12 ? 'AM' : 'PM';
  let h12 = h % 12;
  if(h12 === 0) h12 = 12;
  return { h12, min, period };
}
function formatTimeRange(start, end){
  const s = parseTime12(start);
  const e = parseTime12(end);
  if(!s && !e) return '';
  if(s && !e) return `${s.h12}:${s.min} ${s.period}`;
  if(!s && e) return `${e.h12}:${e.min} ${e.period}`;
  if(s.period === e.period) return `${s.h12}:${s.min}\u2013${e.h12}:${e.min} ${e.period}`;
  return `${s.h12}:${s.min} ${s.period}\u2013${e.h12}:${e.min} ${e.period}`;
}
function toast(msg, isErr){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = isErr ? 'show err' : 'show';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> el.classList.remove('show'), 2600);
}
const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
function formatDateLabel(dateStr){
  if(!dateStr) return '未设置日期';
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return dateStr;
  return `${d.getMonth()+1}月${d.getDate()}日 ${WEEKDAYS[d.getDay()]}`;
}

function seatMeta(course){
  const enrolled = enrolledOf(course.id).length;
  const cap = Math.max(1, Number(course.capacity)||1);
  const remaining = cap - enrolled;
  let status = 'ok';
  if(remaining <= 0) status = 'full';
  else if(remaining / cap <= 0.3) status = 'low';
  return {enrolled, cap, remaining: Math.max(0,remaining), status};
}
function seatDotsHtml(meta, compact){
  const colorVar = meta.status==='full' ? 'var(--full)' : meta.status==='low' ? 'var(--low)' : 'var(--moss)';
  if(meta.cap > 30){
    const pct = Math.min(100, Math.round((meta.enrolled/meta.cap)*100));
    return `<div style="width:${compact?'100%':'120px'};height:${compact?'5px':'8px'};border-radius:5px;background:var(--line);overflow:hidden;">
      <div style="width:${pct}%;height:100%;background:${colorVar};"></div></div>`;
  }
  let dots = '';
  for(let i=0;i<meta.cap;i++){
    dots += `<span class="seat-dot ${compact?'sm':''} ${i<meta.enrolled?'filled':''}" style="--dot-color:${colorVar}"></span>`;
  }
  return `<div class="seat-dots ${compact?'compact':''}">${dots}</div>`;
}

function renderBoard(){
  const el = document.getElementById('boardArea');
  if(!el) return;
  if(!state.loaded){
    el.innerHTML = `<div class="empty-state"><div class="glyph">⏳</div><p>正在加载课程板…</p></div>`;
    return;
  }
  const visibleCourses = SHARE_TEACHER_ID
    ? state.courses.filter(c=>c.teacherId===SHARE_TEACHER_ID)
    : state.courses;

  if(visibleCourses.length===0){
    const teacher = SHARE_TEACHER_ID ? state.teachers.find(t=>t.id===SHARE_TEACHER_ID) : null;
    el.innerHTML = `<div class="empty-state">
      <div class="glyph">🗓️</div>
      <h3>${SHARE_TEACHER_ID ? (teacher ? escapeHtml(teacher.name)+' 暂无开放课程' : '这个老师的分享链接暂时无效') : '还没有发布任何课程'}</h3>
      <p>${SHARE_TEACHER_ID ? '请联系机构获取最新课程链接' : (isAdmin ? '点击右上角「＋ 发布课程」，发布第一门课吧' : '机构还没有开放报名，请稍后再来看看')}</p>
    </div>`;
    return;
  }
  const isSeedOnly = visibleCourses.length===1 && visibleCourses[0].id==='seed-course-math';

  // 按授课老师分组。带 teacher 参数的分享链接只渲染指定老师名下课程。
  const groups = {};
  visibleCourses.forEach(c=>{
    const key = c.teacherId || '__no_teacher__';
    (groups[key] = groups[key] || []).push(c);
  });

  // 分组顺序：跟着「老师管理」里老师的排列顺序走，未指定老师的课程统一放最后
  const teacherOrder = state.teachers.map(t=>t.id);
  const sortedKeys = Object.keys(groups).sort((a,b)=>{
    if(a==='__no_teacher__') return 1;
    if(b==='__no_teacher__') return -1;
    const ia = teacherOrder.indexOf(a), ib = teacherOrder.indexOf(b);
    if(ia===-1 && ib===-1) return 0;
    if(ia===-1) return 1;
    if(ib===-1) return -1;
    return ia-ib;
  });

  let html = '';
  if(state.offline){
    html += `<div class="seed-notice">📶 连接云端数据超时，当前为本地预览，操作可能无法保存。请检查网络后刷新页面重试。</div>`;
  }else if(isSeedOnly){
    html += `<div class="seed-notice">👋 这是示例课程，帮你预览页面效果${isAdmin ? '，可点击下方「编辑」改成真实课程，或「删除」后自行发布' : '，机构正式课程发布后会替换成真实内容'}</div>`;
  }
  sortedKeys.forEach(key=>{
    const teacher = state.teachers.find(t=>t.id===key);
    const teacherLabel = teacher ? teacher.name : '未指定老师';
    const courses = groups[key].sort((a,b)=>
      (a.date||'').localeCompare(b.date||'') || (a.startTime||'').localeCompare(b.startTime||'')
    );
    // 老师头卡（深色）+ 名下课程网格，统一包进 teacher-group 容器里，
    // 形成一个视觉整体，不管有没有填写老师简介，头卡样式保持一致
    /* 简介统一改为点击后弹窗阅读（而不是原地展开）：
       原地展开时，过长的简介会把「收起」按钮顶到很远的地方，家长读完还要往回滑才能关闭；
       弹窗内容可滚动，关闭按钮固定跟在文字末尾（modal-actions），读完就在眼前，不用再滑回顶部 */
    const bioHtml = (teacher && teacher.bio) ? `
        <div class="teacher-header-bio">
          <p class="teacher-bio-text">${escapeHtml(teacher.bio)}</p>
          <button class="desc-toggle visible" onclick="showTeacherBio('${key}')"><span class="label">简介</span><span class="chev">›</span></button>
        </div>` : '';

    // 收费标准同一位老师名下所有课程都一样，不再逐张课程卡片重复展示，
    // 统一取老师本人设置的收费（找不到时退回该老师名下第一门课程绑定的收费方案），在老师头卡里显示一次
    let feeSourceText = (teacher && teacher.feeNotice || '').trim();
    if(!feeSourceText){
      const courseWithPlan = courses.find(c=>c.feePlanId);
      if(courseWithPlan){
        const fp = state.feePlans.find(p=>p.id===courseWithPlan.feePlanId);
        if(fp) feeSourceText = (fp.text || fp.name || '').trim();
      }
    }
    const feeLines = feeSourceText ? feeSourceText.split(/\r?\n/).map(l=>l.trim()).filter(Boolean) : [];
    const feeExpanded = !!expandedTeacherFees[key];
    const feeSummary = feeLines.join('　·　');
    const feeFull = feeLines.join('\n');
    const feeHtml = (teacher || feeLines.length) ? `
        <div class="teacher-header-fee">
          <span class="teacher-header-fee-icon">💰</span>
          <p class="teacher-header-fee-text ${feeExpanded?'expanded':''}">${feeLines.length ? `<b>收费标准：</b>${escapeHtml(feeExpanded?feeFull:feeSummary)}` : '老师还没有设置收费标准'}</p>
          ${feeLines.length ? `<button class="desc-toggle visible" onclick="toggleTeacherFee('${key}')"><span class="label">${feeExpanded?'收起':'查看详情'}</span><span class="chev">›</span></button>` : ''}
        </div>` : '';

    html += `<div class="teacher-group">
      <div class="teacher-header-card">
        <div class="teacher-header-top">
          <span class="teacher-avatar-lg" aria-hidden="true">${escapeHtml(initials(teacherLabel))}</span>
          <span class="teacher-name-lg">${escapeHtml(teacherLabel)}</span>
          ${teacher ? `${SHARE_TEACHER_ID ? '' : `<button class="teacher-share-btn" onclick="enterTeacherBoard('${key}')" title="只分享这位老师的课程">进入该老师课程板</button>`}` : ''}
        </div>${bioHtml}${feeHtml}
      </div>
      <div class="teacher-group-body">`;

    // 同一位老师如果在不同日期都有课，这里再按日期拆出一个小标签，
    // 家长可以先扫一眼时间段，再决定点开哪张课程卡片，不用逐张卡片核对时间
    // 交替底色按该老师名下全部课程的顺序计算；即使跨日期分组也不会重新从白色开始
    const courseIndexMap = new Map(courses.map((c,i)=>[c.id,i]));
    const uniqueDates = [...new Set(courses.map(c=>c.date || ''))];
    if(uniqueDates.length > 1){
      uniqueDates.sort((a,b)=>a.localeCompare(b)).forEach(date=>{
        const dateCourses = courses.filter(c=>(c.date||'')===date);
        html += `<div class="time-subheader"><span class="pill">${date ? formatDateLabel(date) : '日期待定'}</span><span class="sub-line"></span></div>`;
        html += `<div class="grid">${dateCourses.map(c=>courseCardHtml(c, courseIndexMap.get(c.id) || 0)).join('')}</div>`;
      });
    }else{
      html += `<div class="grid">${courses.map(c=>courseCardHtml(c, courseIndexMap.get(c.id) || 0)).join('')}</div>`;
    }
    html += `</div></div>`;
  });
  el.innerHTML = html;
}

function buildTeacherShareUrl(teacherId){
  const url = new URL(window.location.href);
  url.searchParams.set('teacher', teacherId);
  if(ORG_ID && ORG_ID!=='main_data') url.searchParams.set('org', ORG_ID);
  return url.toString();
}

async function copyTeacherShareLink(teacherId){
  const teacher = state.teachers.find(t=>t.id===teacherId);
  if(!teacher){ toast('没有找到这位老师', true); return; }
  const shareUrl = buildTeacherShareUrl(teacherId);
  try{
    await navigator.clipboard.writeText(shareUrl);
    toast(`已复制 ${teacher.name} 老师课程链接`);
  }catch(err){
    const ta = document.createElement('textarea');
    ta.value = shareUrl;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    toast(ok ? `已复制 ${teacher.name} 老师课程链接` : '复制失败，请手动复制网址', !ok);
  }
}

async function shareTeacherCourses(teacherId){
  const teacher = state.teachers.find(t=>t.id===teacherId);
  if(!teacher){ toast('没有找到这位老师', true); return; }

  const shareUrl = buildTeacherShareUrl(teacherId);
  const copy = teacherShareCopy(teacher);

  // 微信内置浏览器里不再强行调用系统 Web Share。
  // 直接进入老师专属页，随后用微信右上角“...”转发，
  // 这是最稳定的链接分享方式，也能保留老师专属标题。
  if(isWeChatBrowser()){
    window.location.href = shareUrl;
    return;
  }

  const shareData = { title: copy.title, text: copy.text, url: shareUrl };

  // Safari / Chrome 等普通手机浏览器可使用系统链接分享。
  if(isMobileDevice() && navigator.share){
    try{
      await navigator.share(shareData);
      return;
    }catch(err){
      if(err && err.name === 'AbortError') return;
    }
  }

  // 桌面或不支持系统分享时，用稳定的复制链接弹窗。
  openTeacherShareModal(teacherId);
}

function timeSelectHtml(idPrefix, currentValue){
  const parts = (currentValue||'').match(/^(\d{1,2}):(\d{2})$/);
  const curH = parts ? parts[1].padStart(2,'0') : '';
  const curM = parts ? parts[2] : '';
  let hourOpts = `<option value="">时</option>`;
  for(let h=0; h<24; h++){
    const hh = String(h).padStart(2,'0');
    hourOpts += `<option value="${hh}" ${hh===curH?'selected':''}>${hh}</option>`;
  }
  let minOpts = `<option value="">分</option>`;
  for(let m=0; m<60; m+=5){
    const mm = String(m).padStart(2,'0');
    minOpts += `<option value="${mm}" ${mm===curM?'selected':''}>${mm}</option>`;
  }
  return `<div style="display:flex;align-items:center;gap:6px;">
    <select id="${idPrefix}H" style="flex:1;">${hourOpts}</select>
    <span style="color:var(--slate);font-weight:700;">:</span>
    <select id="${idPrefix}M" style="flex:1;">${minOpts}</select>
  </div>`;
}
function readTimeSelect(idPrefix){
  const h = document.getElementById(idPrefix+'H').value;
  const m = document.getElementById(idPrefix+'M').value;
  if(!h || !m) return '';
  return `${h}:${m}`;
}

      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="cfStartH">开始时间</label>
        ${timeSelectHtml('cfStart', prefill?course.startTime:'')}
      </div>
      <div class="field">
        <label for="cfEndH">结束时间</label>
        ${timeSelectHtml('cfEnd', prefill?course.endTime:'')}
      </div>
    </div>
    <div class="field">
      <label for="cfTeacher">任课老师</label>
      <select id="cfTeacher">
        <option value="">未指定</option>
        ${teacherOptionsHtml(prefill?course.teacherId:null)}

      <div class="field-hint">没有想要的老师？先关闭此窗口，去「老师管理」新增</div>
    </div>
    <div class="field">

      <select id="cfFeePlan">
        <option value="">跟随老师默认收费</option>

    </div>

      <label for="cfCap">名额上限</label>
      <input type="number" id="cfCap" min="1" value="${prefill?(course.capacity||4):4}">
    </div>
    <div class="field">
      <label for="cfDesc">课程简介</label>
      <textarea id="cfDesc" placeholder="教学内容、适合人群等说明">${prefill?escapeHtml(course.description||''):''}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitCourseForm(${editing?`'${courseId}'`:'null'})">${editing?'保存修改':(dupSource?'发布这个新场次':'发布课程')}</button>

async function submitCourseForm(courseId){
  const name = document.getElementById('cfName').value.trim();
  const date = document.getElementById('cfDate').value;
  const grade = document.getElementById('cfGrade').value.trim();
  const startTime = readTimeSelect('cfStart');
  const endTime = readTimeSelect('cfEnd');
  const teacherId = document.getElementById('cfTeacher').value;
  const feePlanId = document.getElementById('cfFeePlan').value;
  const capacity = Math.max(1, parseInt(document.getElementById('cfCap').value)||1);
  const description = document.getElementById('cfDesc').value.trim();

  if(!name){ toast('请填写课程名称', true); return; }
  if(!date){ toast('请选择上课日期', true); return; }

  if(courseId){
    const c = state.courses.find(x=>x.id===courseId);
    Object.assign(c, {name,date,grade,startTime,endTime,teacherId,feePlanId,capacity,description});
  }else{
    state.courses.push({ id: uid(), name,date,grade,startTime,endTime,teacherId,feePlanId,capacity,description });
  }
  closeModal();
  renderBoard();
  const ok = await syncToCloud();
  if(ok) toast(courseId? '课程已更新' : '课程已发布');
}

        <input type="text" value="${escapeHtml(t.name)}" style="border:none;background:none;font-weight:700;font-size:14px;padding:0;width:60%;" onchange="updateTeacherField('${t.id}','name',this.value)">
        <button class="btn btn-danger btn-sm" onclick="deleteTeacher('${t.id}')">删除</button>
      </div>
      <div class="field-hint" style="margin:0 0 4px;">简介</div>
      <textarea placeholder="教龄、擅长方向等介绍" onchange="updateTeacherField('${t.id}','bio',this.value)" style="width:100%;border:1.5px solid var(--line);border-radius:8px;padding:8px;font-size:13px;min-height:50px;font-family:inherit;">${escapeHtml(t.bio||'')}</textarea>
      <div class="field-hint" style="margin:8px 0 4px;">收费标准（会显示在这位老师的课程卡片上，支持换行，建议每行一条）</div>
      <textarea placeholder="支持换行，建议每行一条，例如：&#10;一对一：$80/小时&#10;一对二：$45/人/小时" onchange="updateTeacherField('${t.id}','feeNotice',this.value)" style="width:100%;border:1.5px solid var(--line);border-radius:8px;padding:8px;font-size:13px;min-height:96px;font-family:inherit;line-height:1.6;">${escapeHtml(t.feeNotice||'')}</textarea>
    </div>
  `).join('') || `<p class="field-hint">还没有添加老师</p>`;

  openModal(`
    <h2>老师管理</h2>
    <p class="sub">老师简介和收费标准会自动显示在对应课程卡片上，不同老师可以设置不同收费</p>
    <div class="teacher-list">${list}</div>
    <div class="field">
      <label for="newTeacherName">新增老师</label>
      <input type="text" id="newTeacherName" placeholder="老师姓名">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
      <button class="btn btn-primary" onclick="addTeacher()">＋ 添加</button>
    </div>
  `);
}
async function addTeacher(){
  const name = document.getElementById('newTeacherName').value.trim();
  if(!name){ toast('请填写老师姓名', true); return; }
  state.teachers.push({ id: uid(), name, bio:'', feeNotice:'' });
  await syncToCloud();
  renderTeacherManageModal();
  renderBoard();
  toast('老师已添加');
}
async function updateTeacherField(teacherId, field, value){
  const t = state.teachers.find(x=>x.id===teacherId);
  if(!t) return;
  t[field] = value.trim();
  const ok = await syncToCloud();
  renderBoard();
  if(ok) toast('已保存');
}
async function deleteTeacher(teacherId){
  const used = state.courses.some(c=>c.teacherId===teacherId);
  if(used && !confirm('有课程正在使用这位老师，删除后对应课程会显示"未指定老师"，确定删除吗？')) return;
  state.teachers = state.teachers.filter(t=>t.id!==teacherId);
  state.courses.forEach(c=>{ if(c.teacherId===teacherId) c.teacherId=''; });
  await syncToCloud();
  renderTeacherManageModal();
  renderBoard();
  toast('老师已删除');
}

function exportExcel(){
  if(typeof XLSX === 'undefined'){ toast('导出组件加载失败，请检查网络', true); return; }
  if(state.courses.length===0){ toast('还没有课程数据可导出', true); return; }

  const teacherName = id => (state.teachers.find(t=>t.id===id)||{}).name || '未指定';

  const detail = [['课程名称','授课老师','上课日期','上课时间','学生姓名','家长手机尾号','家长微信名','付款状态','报名时间']];
  state.signups.forEach(s=>{
    const c = state.courses.find(c=>c.id===s.courseId);
    detail.push([
      c? c.name : '（课程已删除）',
      c? teacherName(c.teacherId) : '',
      c? c.date : '',
      c? formatTimeRange(c.startTime, c.endTime) : '',
      s.studentName, s.phoneLast4, s.wechatName||'', s.paid?'已收款':'待收款',
      new Date(s.ts).toLocaleString('zh-CN')
    ]);
  });

  const summary = [['日期','时间','课程名称','老师','已报名','名额上限','剩余名额','报满率']];
  state.courses.forEach(c=>{
    const meta = seatMeta(c);
    summary.push([c.date, formatTimeRange(c.startTime, c.endTime), c.name, teacherName(c.teacherId),
      meta.enrolled, meta.cap, meta.remaining, `${Math.round((meta.enrolled/meta.cap)*100)}%`]);
  });

  const teacherStats = {};
  state.courses.forEach(c=>{
    const name = teacherName(c.teacherId);
    if(!teacherStats[name]) teacherStats[name] = {courses:0, students:0};
    teacherStats[name].courses += 1;
    teacherStats[name].students += enrolledOf(c.id).length;
  });
  const tRows = [['老师姓名','带课数量','总报名人数']];
  Object.keys(teacherStats).forEach(k=>{
    tRows.push([k, teacherStats[k].courses, teacherStats[k].students]);
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(detail), "报名明细");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), "课程概览");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(tRows), "老师统计");
  XLSX.writeFile(wb, `${state.settings.orgName || 'ClassBoard'}_报表_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel 导出成功');
}

/* ========================================================================
   分享海报：把课程信息 + 报名二维码画成一张图，供长按保存后直接当图片发到微信群/朋友圈。

   为什么要这么做：微信只有「认证服务号」通过 JS-SDK（wx.updateAppMessageShareData）
   才能自定义转发链接时显示的标题/描述/图片；个人开发、没有认证公众号的网页，
   不管 <meta og:image> 怎么写，微信转发出去大概率还是显示成一个丑的默认链接图标。
   这是微信平台层面的限制，前端代码无法绕过。
   折中方案：生成一张真正的图片（canvas 绘制），图片消息在微信里天然就是大图展示，
   没有链接卡片的问题，很多培训机构的招生海报就是这样发的。
   ======================================================================== */

function isMobileDevice(){
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '') || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
}


let currentPosterBlob = null;
let currentPosterFile = null;
let currentPosterObjectUrl = '';

function clearPosterShareCache(){
  currentPosterBlob = null;
  currentPosterFile = null;
  if(currentPosterObjectUrl){
    try{ URL.revokeObjectURL(currentPosterObjectUrl); }catch(e){}
    currentPosterObjectUrl = '';
  }
}


function isWeChatBrowser(){
  return /MicroMessenger/i.test(navigator.userAgent || '');
}

function openWechatPosterFullscreen(){
  if(!currentPosterObjectUrl && currentPosterBlob){
    currentPosterObjectUrl = URL.createObjectURL(currentPosterBlob);
  }
  if(!currentPosterObjectUrl){
    toast('海报还在生成，请稍等');
    return;
  }

  const old = document.getElementById('wechatPosterFullscreen');
  if(old) old.remove();

  const layer = document.createElement('div');
  layer.id = 'wechatPosterFullscreen';
  layer.className = 'wechat-poster-fullscreen';
  layer.innerHTML = `
    <div class="wechat-poster-toolbar">
      <strong>长按下面图片即可转发</strong>
      <button type="button" class="wechat-poster-close" onclick="closeWechatPosterFullscreen()">关闭</button>
    </div>
    <img class="wechat-poster-image" src="${currentPosterObjectUrl}" alt="课程分享海报">
    <div class="wechat-poster-help">
      在微信内请<strong>长按海报图片</strong>，然后选择“发送给朋友”或“保存图片”。<br>
      这样不会跳出当前页面，也不会因为系统分享面板而退出。
    </div>
  `;
  document.body.appendChild(layer);
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
}

function closeWechatPosterFullscreen(){
  const layer = document.getElementById('wechatPosterFullscreen');
  if(layer) layer.remove();
  document.documentElement.style.overflow = '';
  document.body.style.overflow = '';
}

async function shareGeneratedPoster(ev){
  if(ev){
    ev.preventDefault();
    ev.stopPropagation();
  }
  if(!currentPosterBlob){
    toast('海报还在生成，请稍等');
    return;
  }

  // 微信内置浏览器对 Web Share + 文件支持不稳定，
  // 常见现象就是点“转发”后分享层直接消失或页面跳出。
  // 在微信里改为直接展示原始海报，让微信自己的“长按图片”菜单处理转发。
  if(isWeChatBrowser()){
    openWechatPosterFullscreen();
    return;
  }

  const org = state.settings.orgName || 'ClassBoard';
  const file = currentPosterFile || new File(
    [currentPosterBlob],
    `${org}_课程报名海报.jpg`,
    {type:'image/jpeg'}
  );

  try{
    if(navigator.share){
      const data = { files:[file], title:`${org} · 课程报名` };
      if(!navigator.canShare || navigator.canShare({files:[file]})){
        await navigator.share(data);
        return;
      }
    }
  }catch(err){
    if(err && err.name === 'AbortError') return;
    console.warn('图片系统分享失败：', err);
  }

  // 其他不支持文件分享的手机，也使用图片全屏方案，不再让页面“跳出”。
  openWechatPosterFullscreen();
}
function downloadGeneratedPoster(ev){
  if(ev){
    ev.preventDefault();
    ev.stopPropagation();
  }
  if(!currentPosterBlob){
    toast('海报还在生成，请稍等');
    return;
  }
  const org = state.settings.orgName || 'ClassBoard';
  if(!currentPosterObjectUrl){
    currentPosterObjectUrl = URL.createObjectURL(currentPosterBlob);
  }
  const a = document.createElement('a');
  a.href = currentPosterObjectUrl;
  a.download = `${org}_课程报名海报.jpg`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function openPosterModal(){
  const mobile = isMobileDevice();
  clearPosterShareCache();
  openModal(`
    <h2>生成分享海报</h2>
    <p class="sub">${mobile
      ? '海报作为备用分享方式，可保存图片后从微信相册发送。'
      : '生成后可下载图片，或直接把图片拖进微信聊天窗口发送。'}</p>

    <div id="posterPreviewBox" style="display:flex;flex-direction:column;align-items:center;gap:12px;min-height:120px;justify-content:center;">
      <div style="color:var(--slate);font-size:13px;">正在生成海报…</div>
    </div>

    <div class="modal-actions">
      <div class="poster-action-row">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">关闭</button>
        <button type="button" id="posterSaveBtn" class="btn btn-ghost" style="display:none;" onclick="downloadGeneratedPoster(event)">保存图片</button>
        
      </div>
    </div>
  `);
  setTimeout(generatePosterImage, 30);
}
async function generatePosterImage(){
  const box = document.getElementById('posterPreviewBox');
  if(!box) return;
  const mobile = isMobileDevice();

  try{
    if(document.fonts && document.fonts.ready){ await document.fonts.ready; }

    const canvas = await drawPosterCanvas();

    const blob = await new Promise((resolve, reject)=>{
      canvas.toBlob(
        b => b ? resolve(b) : reject(new Error('无法生成图片文件')),
        'image/jpeg',
        0.92
      );
    });

    currentPosterBlob = blob;
    const org = state.settings.orgName || 'ClassBoard';
    currentPosterFile = new File(
      [blob],
      `${org}_课程报名海报.jpg`,
      {type:'image/jpeg', lastModified:Date.now()}
    );

    if(currentPosterObjectUrl){
      try{ URL.revokeObjectURL(currentPosterObjectUrl); }catch(e){}
    }
    currentPosterObjectUrl = URL.createObjectURL(blob);

    box.innerHTML = `
      <img src="${currentPosterObjectUrl}" alt="报名海报"
        style="width:100%;max-width:340px;border-radius:12px;box-shadow:var(--shadow);display:block;-webkit-touch-callout:default;">
      <div style="font-size:13px;color:#6f746f;text-align:center;line-height:1.65;">
        ${mobile
          ? '需要图片版时，可保存海报后从微信相册发送。'
          : '下载后直接把图片拖进微信聊天窗口，发送出去会按图片显示。'}
      </div>
    `;

    const shareBtn = document.getElementById('posterShareBtn');
    const saveBtn = document.getElementById('posterSaveBtn');
    if(saveBtn) saveBtn.style.display = 'inline-flex';

    if(shareBtn){
      const canUseShareButton = isMobileDevice();
      shareBtn.style.display = canUseShareButton ? 'inline-flex' : 'none';
    }
  }catch(err){
    box.innerHTML = `<div style="color:var(--brick);font-size:13px;">海报生成失败：${escapeHtml(String(err && err.message || err))}</div>`;
  }
}
/* 用「先量后画」两遍：第一遍只用来计算总高度（不落笔），第二遍在真正尺寸的画布上绘制，
   这样无论课程有几条，海报高度都刚好，不会留白或被裁掉 */
function drawPosterCanvas(){
  return new Promise((resolve, reject)=>{
    try{
      const W = 750;
      const measureCanvas = document.createElement('canvas');
      const mctx = measureCanvas.getContext('2d');
      const finalH = layoutPoster(mctx, W, false);

      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = finalH;
      const ctx = canvas.getContext('2d');
      layoutPoster(ctx, W, true);

      renderQrOntoCanvas(ctx, canvas, W, finalH, resolve, reject);
    }catch(e){ reject(e); }
  });
}

/* draw=false 时只计算高度，draw=true 时才真正 fill/stroke/fillText。
   返回值：整张海报最终应有的高度（二维码区域预留在 layoutPoster 之外，由 renderQrOntoCanvas 补上文字） */
function layoutPoster(ctx, W, draw){
  let y = 0;
  const pad = 40;

  // 整张画布先铺一层不透明底色——之前没有这一步，空白区域是透明的，
  // 之前用 PNG 还看不出问题，换成 JPG（不支持透明）之后空白会变黑，
  // 而且部分微信客户端对带透明通道的 PNG 处理本来就不稳定，这很可能正是
  // "转发后图片显示不出来"的根源
  if(draw){
    ctx.fillStyle = '#F7F4EC';
    ctx.fillRect(0, 0, W, ctx.canvas.height);
  }

  // 顶部色带
  const headerH = 168;
  if(draw){
    const grad = ctx.createLinearGradient(0,0,W,0);
    grad.addColorStop(0,'#3F6B52'); grad.addColorStop(1,'#2C4C3B');
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,headerH);

    const org = state.settings.orgName || 'ClassBoard';
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '700 40px "Baloo 2", "ZCOOL KuaiLe", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(truncateText(ctx, org, W-2*pad), pad, 92);
    ctx.font = '500 20px "Noto Sans SC", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.fillText('课程报名', pad, 128);
  }else{
    ctx.font = '700 40px "Baloo 2", "ZCOOL KuaiLe", sans-serif';
  }
  y = headerH + 34;

  // 收费说明
  const fee = (state.settings.feeNotice || '').trim();
  if(fee){
    const boxH = 118;
    if(draw){
      ctx.fillStyle = '#E3EDE5';
      roundRect(ctx, pad, y, W-2*pad, boxH, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(63,107,82,0.35)'; ctx.lineWidth = 1.5;
      roundRect(ctx, pad, y, W-2*pad, boxH, 12); ctx.stroke();
      ctx.fillStyle = '#2C4C3B';
      ctx.font = '700 20px "Noto Sans SC", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('💰 收费标准', pad+18, y+32);
      ctx.fillStyle = '#3A453F';
      ctx.font = '400 18px "Noto Sans SC", sans-serif';
      wrapText(ctx, fee, pad+18, y+62, W-2*pad-36, 27, 2);
    }
    y += boxH + 24;
  }

  // 课程卡片（最多 4 条，按日期排序）
  const posterCourses = SHARE_TEACHER_ID ? state.courses.filter(c=>c.teacherId===SHARE_TEACHER_ID) : state.courses;
  const list = [...posterCourses].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,4);
  if(list.length===0){
    if(draw){
      ctx.fillStyle = '#5B6B63';
      ctx.font = '400 20px "Noto Sans SC", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('暂无课程，请先发布课程', pad, y+30);
    }
    y += 60;
  }else{
    const cardH = 116, gap = 16;
    list.forEach(course=>{
      const meta = seatMeta(course);
      const accent = meta.status==='full' ? '#A9463D' : meta.status==='low' ? '#C98A2C' : '#3F6B52';
      if(draw){
        ctx.fillStyle = '#FFFFFF';
        roundRect(ctx, pad, y, W-2*pad, cardH, 12); ctx.fill();
        ctx.strokeStyle = '#DCD5C0'; ctx.lineWidth = 1.5;
        roundRect(ctx, pad, y, W-2*pad, cardH, 12); ctx.stroke();
        ctx.fillStyle = accent;
        roundRect(ctx, pad, y, 6, cardH, 3); ctx.fill();

        ctx.fillStyle = '#1F2A24';
        ctx.font = '700 26px "Baloo 2", "ZCOOL KuaiLe", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(truncateText(ctx, course.name||'未命名课程', W-2*pad-140), pad+24, y+40);

        ctx.fillStyle = '#5B6B63';
        ctx.font = '400 18px "Noto Sans SC", sans-serif';
        const line = `${formatDateLabel(course.date)}  ${formatTimeRange(course.startTime, course.endTime)}`;
        ctx.fillText(truncateText(ctx, line, W-2*pad-48), pad+24, y+72);

        ctx.fillStyle = accent;
        ctx.font = '700 18px "Noto Sans SC", sans-serif';
        ctx.fillText(meta.status==='full' ? '名额已满' : `余 ${meta.remaining} 位`, pad+24, y+100);
      }
      y += cardH + gap;
    });
  }
  y += 8;

  // CTA 徽章
  const ctaText = '长按下方二维码 · 立即扫码报名';
  const ctaH = 56;
  if(draw){
    ctx.font = '700 24px "Noto Sans SC", sans-serif';
    const ctaW = ctx.measureText(ctaText).width + 60;
    ctx.fillStyle = '#3F6B52';
    roundRect(ctx, (W-ctaW)/2, y, ctaW, ctaH, 28); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.fillText(ctaText, W/2, y+37);
    ctx.textAlign = 'left';
  }
  y += ctaH + 18;

  // 二维码区（这里只预留空间，图像由 renderQrOntoCanvas 补画）
  const qrSize = 260, qrPad = 16;
  if(draw){
    const qrX = (W-qrSize)/2;
    ctx.fillStyle = '#FFFFFF';
    roundRect(ctx, qrX-qrPad, y-qrPad, qrSize+2*qrPad, qrSize+2*qrPad, 16); ctx.fill();
    ctx.strokeStyle = '#DCD5C0'; ctx.lineWidth = 1.5;
    roundRect(ctx, qrX-qrPad, y-qrPad, qrSize+2*qrPad, qrSize+2*qrPad, 16); ctx.stroke();
  }
  y += qrSize;

  // 底部说明文字
  const footerH = 38;
  if(draw){
    ctx.fillStyle = '#5B6B63';
    ctx.font = '400 16px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('微信扫一扫 / 长按图片识别二维码，打开报名页面', W/2, y+24);
    ctx.textAlign = 'left';
  }
  y += footerH;

  return Math.ceil(y);
}

/* qrcodejs 是异步把二维码画进一个隐藏 div 里的（内部用 canvas 或 table），
   所以要等它生成完，再把结果 drawImage 貼到海报画布对应位置上 */
function renderQrOntoCanvas(ctx, canvas, W, H, resolve, reject){
  try{
    const qrSize = 260;
    const qrPad = 16;
    // 二维码的纵向位置需要和 layoutPoster 里预留的位置完全对应，这里重新走一遍布局（不绘制）来算出 y
    const mctx = document.createElement('canvas').getContext('2d');
    const yBeforeQr = layoutPoster(mctx, W, false) - (qrSize + 56); // 减去底部说明文字与二维码本身高度
    const qrX = (W-qrSize)/2;
    const qrY = yBeforeQr;

    const qrHolder = document.createElement('div');
    qrHolder.style.cssText = 'position:fixed;left:-9999px;top:-9999px;';
    document.body.appendChild(qrHolder);
    new QRCode(qrHolder, {
      text: window.location.href,
      width: qrSize, height: qrSize,
      colorDark: '#1F2A24', colorLight: '#FFFFFF',
      correctLevel: QRCode.CorrectLevel.H
    });
    setTimeout(()=>{
      try{
        const qrCanvas = qrHolder.querySelector('canvas');
        const qrImg = qrHolder.querySelector('img');
        if(qrCanvas){ ctx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize); }
        else if(qrImg){ ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize); }
        document.body.removeChild(qrHolder);
        resolve(canvas);
      }catch(e){ reject(e); }
    }, 150);
  }catch(e){ reject(e); }
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function truncateText(ctx, text, maxWidth){
  text = String(text||'');
  if(ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while(t.length>1 && ctx.measureText(t+'…').width>maxWidth){ t = t.slice(0,-1); }
  return t + '…';
}
/* 按字符宽度自动换行（中文没有空格分词，逐字累加更靠谱），超过 maxLines 就在最后一行截断加省略号 */
function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  text = String(text||'');
  const chars = Array.from(text);
  let line = '', lineCount = 0;
  for(let i=0;i<chars.length;i++){
    const test = line + chars[i];
    if(ctx.measureText(test).width > maxWidth && line){
      if(lineCount === maxLines-1){
        ctx.fillText(truncateText(ctx, line + chars.slice(i).join(''), maxWidth), x, y + lineCount*lineHeight);
        return;
      }
      ctx.fillText(line, x, y + lineCount*lineHeight);
      lineCount++;
      line = chars[i];
    }else{
      line = test;
    }
  }
  if(line) ctx.fillText(line, x, y + lineCount*lineHeight);
}

/* 页面一打开就先画出"机构管理"按钮和基础界面，不等云端数据返回，
   避免网络慢或 Firebase 连接延迟时右上角一片空白 */
renderHeaderActions();
renderBrand();
renderBoard();

/* 兜底：如果几秒内云端数据一直没连上（网络受限、预览环境屏蔽了 Firebase 等），
   就先在本地显示示例课程，避免页面永远卡在"正在加载"。等云端真正连通后，
   onSnapshot 会用真实数据自动覆盖这里的本地示例。 */
setTimeout(()=>{
  if(state.loaded) return;
  const seed = templateSeedData();
  state.courses = seed.courses;
  state.teachers = seed.teachers;
  state.signups = seed.signups;
  state.feePlans = seed.feePlans;
  state.settings = seed.settings;
  state.loaded = true;
  state.offline = true;
  renderBrand();
  renderBoard();
  renderHeaderActions();
}, 3500);

</script>
