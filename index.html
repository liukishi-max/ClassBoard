<style>
  :root{
    --ink:#1F2A24;
    --ink-soft:#3A453F;
    --paper:#F7F4EC;
    --paper-deep:#EFE9DA;
    --card:#FFFFFF;
    --moss:#3F6B52;
    --moss-dark:#2C4C3B;
    --moss-tint:#E3EDE5;
    --amber:#C98A2C;
    --amber-tint:#FBF1DF;
    --brick:#A9463D;
    --brick-tint:#F7E7E5;
    --slate:#5B6B63;
    --line:#DCD5C0;
    --radius:14px;
    --shadow: 0 1px 2px rgba(31,42,36,0.06), 0 6px 20px rgba(31,42,36,0.05);
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color: transparent;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans SC', system-ui, -apple-system, sans-serif;
    font-weight:400;
    font-size:15px;
    line-height:1.65;
    letter-spacing:0.1px;
    min-height:100vh;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(31,42,36,0.028) 1px, transparent 1.4px);
    background-size: 30px 30px;
  }
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{ background: var(--moss-tint); }
  :focus-visible{ outline: 2.5px solid var(--moss); outline-offset: 2px; }

  .wrap{ max-width: 1080px; margin: 0 auto; padding: 20px 20px 80px; }

  header{
    display:flex; flex-direction:column; gap:12px; padding-top: 8px;
  }
  .header-top{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:baseline; gap:11px; }
  .admin-entry-btn{
    display:inline-flex; align-items:center; gap:6px; flex-shrink:0; cursor:pointer;
    background:var(--moss-tint); border:1px solid rgba(63,107,82,0.25); color:var(--moss-dark);
    font-size:13px; font-weight:700; padding:7px 14px 7px 12px; border-radius:999px;
    transition: background .15s ease, color .15s ease, transform .12s ease;
  }
  .admin-entry-btn:hover{ background:var(--moss); color:#fff; transform:translateY(-1px); }
  .brand-mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px; border-radius:10px;
    background: linear-gradient(155deg, var(--moss), var(--moss-dark)); color:#fff; font-family:'Baloo 2', 'ZCOOL KuaiLe', sans-serif;
    font-weight:900; font-size:17px; flex-shrink:0; box-shadow:0 3px 8px rgba(44,76,59,0.28);
  }
  .brand-name{ font-family:'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight:900; font-size:27px; letter-spacing:0.3px; }
  .brand-sub{ font-size:13.5px; color:var(--slate); font-weight:500; letter-spacing:0.3px; }
  .tagline{ margin: 6px 0 26px; color:var(--slate); font-size:14px; }

  .seed-notice{
    background:var(--moss-tint); border:1px solid rgba(63,107,82,0.16); border-radius:12px;
    padding:11px 16px; margin-bottom:18px; font-size:12.5px; color:var(--moss-dark); line-height:1.6;
    box-shadow:var(--shadow);
  }

  .header-actions{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    padding-top:11px; border-top:1px dashed var(--line);
  }
  .header-actions:empty{ display:none; }
  .btn{
    border:1.5px solid var(--ink); background:var(--card); color:var(--ink);
    padding:9px 17px; border-radius:999px; font-size:13.5px; font-weight:700;
    letter-spacing:0.2px;
    transition: transform .12s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .btn:hover{ transform: translateY(-1px); box-shadow:0 4px 10px rgba(31,42,36,0.1); }
  .btn:active{ transform: translateY(0); box-shadow:none; }
  .btn-primary{ background:var(--moss); border-color:var(--moss); color:#fff; }
  .btn-primary:hover{ background:var(--moss-dark); }
  .btn-ghost{ border-color:var(--line); }
  .btn-danger{ border-color:var(--brick); color:var(--brick); background:#fff; }
  .btn-danger:hover{ background:var(--brick-tint); }
  .btn-sm{ padding:6px 12px; font-size:13px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }

  .admin-pill{
    display:flex; align-items:center; gap:8px; background:var(--moss-tint);
    border:1px solid var(--moss); color:var(--moss-dark); font-size:13px; font-weight:700;
    padding:7px 12px 7px 10px; border-radius:999px;
  }
  .admin-pill .dot{ width:7px; height:7px; border-radius:50%; background:var(--moss); display:inline-block; }

  .date-divider{
    display:flex; align-items:center; gap:12px; margin: 34px 0 16px;
  }
  .date-divider:first-of-type{ margin-top: 18px; }
  .date-label{
    font-family:'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight:700; font-size:15.5px; letter-spacing:0.3px;
    background:var(--ink); color:var(--paper); padding:6px 15px 6px 13px;
    border-radius: 3px 10px 10px 3px; position:relative;
  }
  .date-label::before{
    content:''; position:absolute; left:-6px; top:50%; transform:translateY(-50%);
    width:6px; height:6px; border-radius:50%; background:#5B6B63;
    box-shadow: 0 0 0 2px var(--paper);
  }
  .date-line{ flex:1; height:1px; background: var(--line); }

  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:18px; }

  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    border:1px solid var(--line); padding:19px 20px; display:flex; flex-direction:column; gap:11px;
    position:relative; overflow:hidden;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{
    transform: translateY(-2px);
    box-shadow: 0 2px 4px rgba(31,42,36,0.07), 0 12px 28px rgba(31,42,36,0.09);
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; width:4px; height:100%; background: var(--card-accent, var(--moss));
  }
  .course-name{
    font-family:'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight:700; font-size:19.5px; margin:0;
    letter-spacing:0.2px; line-height:1.4; color:var(--ink);
  }

  /* 信息方块：上课时间 / 年级 / 剩余名额 — 各自独立浅色区块，参考报名系统的工整卡片风格 */
  .info-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(84px, 1fr));
    background:rgba(63,107,82,0.22); border:1px solid rgba(63,107,82,0.22); border-radius:12px;
    gap:1px; overflow:hidden;
  }
  .info-cell{
    background:var(--moss-tint); padding:9px 11px 10px; display:flex; flex-direction:column; gap:3px; min-width:0;
  }
  .info-label{
    font-size:10.5px; font-weight:600; color:var(--slate); letter-spacing:0.2px;
    display:flex; align-items:center; gap:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .info-value{
    font-size:13px; font-weight:700; color:var(--ink); line-height:1.35; letter-spacing:0.1px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .info-value-sub{ font-weight:600; color:var(--ink-soft); font-size:12px; }
  .info-value.seat-full{ color:var(--brick); }
  .info-value.seat-low{ color:var(--amber); }
  .info-cell .seat-dots{ margin-top:2px; }

  /* 课程简介：独立浅色区块 */
  .desc-block{
    background:var(--moss-tint); border:1px solid rgba(63,107,82,0.18); border-radius:12px; padding:11px 13px;
  }
  .desc-header{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .desc-avatar{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(155deg, var(--moss), var(--moss-dark)); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight:800; font-size:13px;
  }
  .desc-label{ font-size:13.5px; font-weight:700; color:var(--ink); letter-spacing:0.1px; flex:1; }
  .desc-wrap{ display:flex; flex-direction:column; gap:4px; }
  .desc{
    font-size:13.5px; color:var(--ink-soft); margin:0; white-space:pre-wrap;
    line-height:1.6; letter-spacing:0.1px;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden;
  }
  .desc.expanded{ -webkit-line-clamp:unset; overflow:visible; }
  .desc.empty{ color:#9AA69D; font-style:italic; -webkit-line-clamp:1; }
  .desc-toggle{
    background:none; border:none; padding:0; margin:0; flex-shrink:0;
    font-size:12px; font-weight:700; color:var(--moss); cursor:pointer;
    display:none; align-items:center; gap:3px;
  }
  .desc-toggle:hover{ color:var(--moss-dark); }
  .desc-toggle.visible{ display:inline-flex; }
  .desc-toggle .label{ text-decoration:underline; text-underline-offset:2px; }
  .desc-toggle .chev{ font-size:12px; display:inline-block; }

  /* 授课老师：独立浅色区块，头像 + 姓名 */
  .teacher-block{
    display:flex; align-items:center; gap:10px;
    background:var(--moss-tint); border:1px solid rgba(63,107,82,0.18); border-radius:12px;
    padding:9px 13px;
  }
  .teacher-avatar{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(155deg, var(--moss), var(--moss-dark)); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight:800; font-size:13px;
  }
  .teacher-meta{ display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
  .teacher-name{ font-size:13.5px; font-weight:700; color:var(--ink); letter-spacing:0.1px; }
  .teacher-role{ font-size:13.5px; font-weight:700; color:var(--ink); letter-spacing:0.1px; }
  .link-btn{
    background:none; border:none; color:var(--moss); font-size:12px; font-weight:700;
    padding:0; flex-shrink:0; display:inline-flex; align-items:center; gap:3px;
  }
  .link-btn .label{ text-decoration:underline; text-underline-offset:2px; }
  .link-btn .chev{ font-size:12px; display:inline-block; }

  .card-teacher-tag{
    display:flex; align-items:center; gap:6px; margin-bottom:8px;
  }
  .card-teacher-tag .mini-avatar{
    width:18px; height:18px; border-radius:50%; background:var(--moss-tint);
    display:flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0;
  }
  .card-teacher-tag .mini-name{
    font-size:12px; font-weight:700; color:var(--moss-dark); letter-spacing:0.1px;
  }

  .fee-list{ display:flex; flex-direction:column; gap:5px; }
  .fee-line{
    position:relative; padding-left:14px; font-size:13px; color:var(--ink-soft);
    line-height:1.5; letter-spacing:0.1px;
  }
  .fee-line::before{
    content:''; position:absolute; left:1px; top:7px; width:5px; height:5px; border-radius:50%;
    background:var(--amber);
  }

  /* 老师 + 该老师名下课程 合并为一个整体分组容器：
     深色老师头卡在上（不再有自己的圆角/阴影/margin），下方课程网格共用同一个浅色底盒，
     视觉上连成一体，避免老师区块和课程卡片"各自为政"的割裂感 */
  .teacher-group{
    background: var(--paper-deep); border-radius: 18px; overflow:hidden;
    border: 1px solid var(--line); box-shadow: var(--shadow);
    margin: 34px 0 20px;
  }
  .teacher-group:first-of-type{ margin-top: 18px; }
  .teacher-group-body{ padding: 16px 16px 18px; }
  .teacher-group-body .grid{ margin:0; }
  .teacher-group-body .time-subheader:first-child{ margin-top:0; }

  .teacher-header-card{
    background: linear-gradient(155deg, #26302A, var(--ink) 70%);
    padding: 15px 18px 16px; position:relative;
  }
  .teacher-header-top{ display:flex; align-items:center; gap:11px; }
  .teacher-avatar-lg{
    width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.14); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;
    border:1px solid rgba(255,255,255,0.18);
  }
  .teacher-name-lg{
    font-family:'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight:700; font-size:17px;
    color:#fff; letter-spacing:0.2px;
  }
  .teacher-header-bio{
    display:flex; align-items:flex-start; gap:8px; margin-top:8px; padding-left:47px;
  }
  .teacher-bio-text{
    flex:1; margin:0; font-size:13px; font-style:italic; color:rgba(255,255,255,0.62); line-height:1.6;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:1; overflow:hidden;
  }
  .teacher-bio-text.expanded{ -webkit-line-clamp:unset; overflow:visible; white-space:pre-wrap; }
  .teacher-header-bio .desc-toggle{ color:rgba(255,255,255,0.85); }
  .teacher-header-bio .desc-toggle:hover{ color:#fff; }

  .seat-dots{ display:flex; flex-wrap:wrap; gap:4px; max-width:180px; }
  .seat-dot{ width:9px; height:9px; border-radius:50%; background:var(--line); flex-shrink:0; }
  .seat-dot.sm{ width:6px; height:6px; }
  .seat-dots.compact{ max-width:100%; gap:3px; }
  .seat-dot.filled{ background: var(--dot-color, var(--moss)); }

  .card-actions{ display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .card-actions .btn{ flex:1; text-align:center; }


  .roster-toggle{
    font-size:12.5px; font-weight:700; color:var(--slate); background:none; border:none;
    padding:4px 0 0; text-align:left; display:flex; align-items:center; gap:5px;
  }
  .roster{
    display:none; border-top:1px dashed var(--line); margin-top:4px; padding-top:10px;
    flex-direction:column; gap:6px; max-height:220px; overflow-y:auto;
  }
  .roster.open{ display:flex; }
  .roster-empty{ font-size:12.5px; color:#9AA69D; font-style:italic; }
  .roster-row{
    display:flex; align-items:center; justify-content:space-between; font-size:13px;
    background:var(--paper-deep); border-radius:8px; padding:6px 9px; gap:8px;
  }
  .roster-name{ font-weight:600; }
  .roster-name-input{
    border:1px solid var(--line); border-radius:6px; padding:2px 6px; font-size:13px; font-weight:600;
    font-family:inherit; background:#fff; width:110px;
  }
  .roster-phone{ font-family:'IBM Plex Mono', monospace; color:var(--slate); font-size:11.5px; }
  .pay-btn{
    font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; border:1.5px solid var(--line);
    background:#fff; color:var(--slate); flex-shrink:0;
  }
  .pay-btn.paid{ border-color:var(--moss); background:var(--moss-tint); color:var(--moss-dark); }
  .pay-btn.unpaid{ border-color:var(--amber); background:var(--amber-tint); color:#8a611f; }

  .time-subheader{ display:flex; align-items:center; gap:10px; margin: 6px 0 12px; }
  .time-subheader .pill{
    font-size:12px; font-weight:700; color:var(--moss-dark); background:var(--moss-tint);
    border:1px solid rgba(63,107,82,0.22); padding:4px 13px; border-radius:999px; letter-spacing:0.2px;
    white-space:nowrap;
  }
  .time-subheader .sub-line{ flex:1; height:1px; background:var(--line); }

  .empty-state{ text-align:center; padding: 70px 20px; color:var(--slate); }
  .empty-state .glyph{ font-size:34px; margin-bottom:10px; }
  .empty-state h3{ font-family:'Baloo 2', 'ZCOOL KuaiLe', sans-serif; color:var(--ink); margin:0 0 6px; font-size:18px; font-weight:700; }
  .empty-state p{ font-size:13.5px; }

  .overlay{
    position:fixed; inset:0; background:rgba(31,42,36,0.45); backdrop-filter: blur(2px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .modal{
    background:#fff; border-radius:18px; max-width:480px; width:100%;
    max-height:88vh; overflow-y:auto; padding:26px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    position:relative;
  }
  .modal h2{ font-family:'Baloo 2', 'ZCOOL KuaiLe', sans-serif; margin:0 0 4px; font-size:21px; font-weight:700; letter-spacing:0.2px; }
  .modal .sub{ color:var(--slate); font-size:13px; margin: 0 0 18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; font-weight:700; margin-bottom:5px; color:var(--ink-soft); }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border-radius:9px; border:1.5px solid var(--line);
    font-family:inherit; font-size:14px; background:var(--paper-deep); color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .field-hint{ font-size:12px; color:var(--slate); margin-top:4px; }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .modal-actions .btn{ flex:1; text-align:center; }
  .modal-close{
    position:absolute; top:16px; right:16px; background:none; border:none; font-size:20px; color:var(--slate);
  }
  .teacher-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .teacher-item{ background:var(--paper-deep); border-radius:10px; padding:10px 12px; }
  .teacher-item-name{ font-weight:700; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }

  #toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:999px; font-size:13.5px;
    font-weight:600; opacity:0; pointer-events:none; transition: all .25s ease; z-index:200; box-shadow:var(--shadow);
    max-width: 90vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.err{ background:var(--brick); }

  @media (max-width:520px){
    .brand-name{ font-size:22px; }
    .field-row{ flex-direction:column; gap:0; }
    .card-actions{ flex-direction:column; }
    .card-actions .btn{ width:100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-top">
      <div class="brand">
        <span class="brand-mark" id="brandMark">C</span>
        <span class="brand-name" id="brandTitle">ClassBoard</span>
        <span class="brand-sub">课程板</span>
      </div>
      <div id="headerEntry"></div>
    </div>
    <div class="header-actions" id="headerActions"></div>
  </header>
  <div id="boardArea"></div>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
const ADMIN_PASSWORD = "1234";
// 从网址参数里读取机构标识，例如 ?org=katy —— 不同机构用不同的 org 参数，
// 数据会各自独立存储，互不影响。没带参数时用 "main_data"，兼容之前已有的数据。
const ORG_ID = (new URLSearchParams(window.location.search).get('org') || 'main_data').trim() || 'main_data';
const state = { courses: [], teachers: [], signups: [], feePlans: [], settings: { orgName: "ClassBoard" }, loaded:false };
let isAdmin = false;
let openRosters = {};
let expandedDescs = {};
let expandedFees = {};
let expandedTeacherBios = {};

/* 首个访问、云端还没有任何数据时使用的示例模板，避免首页一片空白。
   管理员可以直接在「机构管理」里编辑或删除这门课，改成自己的真实课程即可。 */
function templateSeedData(){
  const teacherId = 'seed-teacher-erin';
  const courseId = 'seed-course-math';
  const d = new Date();
  d.setDate(d.getDate() + 7);
  const dateStr = d.toISOString().slice(0,10);
  return {
    courses: [{
      id: courseId,
      name: '数学试课',
      date: dateStr,
      grade: '一至三年级',
      startTime: '09:00',
      endTime: '10:00',
      teacherId: teacherId,
      feePlanId: 'seed-plan-default',
      capacity: 4,
      description: 'Ms. Erin 拥有10年以上少儿教育经验，擅长用引导式提问带动孩子独立思考，帮助建立数感与逻辑思维习惯。本次试课从生活情境切入，让孩子在轻松的氛围中体验数学的乐趣，欢迎家长陪同试听。'
    }],
    teachers: [{
      id: teacherId,
      name: 'Ms. Erin',
      bio: '10年以上少儿数学与思维教学经验，擅长思维引导式教学，课堂氛围轻松有趣，深受学生和家长喜爱。',
      feeNotice: '单次试课 100 元，正式课 150 元/次，报名后请添加老师微信付款'
    }],
    feePlans: [{
      id: 'seed-plan-default',
      name: '标准收费',
      text: '单次试课 100 元，正式课 150 元/次，报名后请添加老师微信付款'
    }],
    signups: [],
    settings: { orgName: "ClassBoard" }
  };
}

function initFirebaseSync(){
  const db = window.firebaseDb;
  const { doc, onSnapshot } = window.FirebaseSdk;

  onSnapshot(doc(db, "classboard", ORG_ID), (docSnap) => {
    if (docSnap.exists()) {
      const data = docSnap.data();
      state.courses = data.courses || [];
      state.teachers = data.teachers || [];
      state.signups = data.signups || [];
      state.feePlans = data.feePlans || [];
      state.settings = data.settings || { orgName: "ClassBoard" };
    } else {
      const seed = templateSeedData();
      state.courses = seed.courses;
      state.teachers = seed.teachers;
      state.signups = seed.signups;
      state.feePlans = seed.feePlans;
      state.settings = seed.settings;
    }
    state.loaded = true;
    state.offline = false;
    renderBrand();
    renderBoard();
    renderHeaderActions();
  }, (error) => {
    console.error("Firebase 监听失败:", error);
    toast("数据同步异常，请检查网络", true);
  });
}

async function syncToCloud(){
  try {
    const db = window.firebaseDb;
    const { doc, setDoc } = window.FirebaseSdk;
    await setDoc(doc(db, "classboard", ORG_ID), {
      courses: state.courses,
      teachers: state.teachers,
      signups: state.signups,
      feePlans: state.feePlans,
      settings: state.settings
    });
    return true;
  } catch(e) {
    console.error("同步云端失败:", e);
    toast('保存失败，请检查网络后重试', true);
    return false;
  }
}

function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function parseTime12(t){
  if(!t) return null;
  const m = String(t).trim().match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  let h = parseInt(m[1],10);
  const min = m[2];
  const period = h < 12 ? 'AM' : 'PM';
  let h12 = h % 12;
  if(h12 === 0) h12 = 12;
  return { h12, min, period };
}
function formatTimeRange(start, end){
  const s = parseTime12(start);
  const e = parseTime12(end);
  if(!s && !e) return '';
  if(s && !e) return `${s.h12}:${s.min} ${s.period}`;
  if(!s && e) return `${e.h12}:${e.min} ${e.period}`;
  if(s.period === e.period) return `${s.h12}:${s.min}\u2013${e.h12}:${e.min} ${e.period}`;
  return `${s.h12}:${s.min} ${s.period}\u2013${e.h12}:${e.min} ${e.period}`;
}
function toast(msg, isErr){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = isErr ? 'show err' : 'show';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> el.classList.remove('show'), 2600);
}
const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
function formatDateLabel(dateStr){
  if(!dateStr) return '未设置日期';
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return dateStr;
  return `${d.getMonth()+1}月${d.getDate()}日 ${WEEKDAYS[d.getDay()]}`;
}
function enrolledOf(courseId){
  return state.signups.filter(s=>s.courseId===courseId);
}

function seatMeta(course){
  const enrolled = enrolledOf(course.id).length;
  const cap = Math.max(1, Number(course.capacity)||1);
  const remaining = cap - enrolled;
  let status = 'ok';
  if(remaining <= 0) status = 'full';
  else if(remaining / cap <= 0.3) status = 'low';
  return {enrolled, cap, remaining: Math.max(0,remaining), status};
}
function seatDotsHtml(meta, compact){
  const colorVar = meta.status==='full' ? 'var(--brick)' : meta.status==='low' ? 'var(--amber)' : 'var(--moss)';
  if(meta.cap > 30){
    const pct = Math.min(100, Math.round((meta.enrolled/meta.cap)*100));
    return `<div style="width:${compact?'100%':'120px'};height:${compact?'5px':'8px'};border-radius:5px;background:var(--line);overflow:hidden;">
      <div style="width:${pct}%;height:100%;background:${colorVar};"></div></div>`;
  }
  let dots = '';
  for(let i=0;i<meta.cap;i++){
    dots += `<span class="seat-dot ${compact?'sm':''} ${i<meta.enrolled?'filled':''}" style="--dot-color:${colorVar}"></span>`;
  }
  return `<div class="seat-dots ${compact?'compact':''}">${dots}</div>`;
}

function courseCardHtml(course){
  const meta = seatMeta(course);
  const teacher = state.teachers.find(t=>t.id===course.teacherId);
  const feePlan = state.feePlans.find(p=>p.id===course.feePlanId);
  const feePlanFee = feePlan ? (feePlan.text || feePlan.name || '').trim() : '';
  const teacherFee = feePlanFee || (teacher && teacher.feeNotice || '').trim();
  const accentColor = meta.status==='full' ? 'var(--brick)' : meta.status==='low' ? 'var(--amber)' : 'var(--moss)';
  const enrolledList = enrolledOf(course.id).slice().sort((a,b)=> (b.paid?1:0) - (a.paid?1:0));
  const rosterOpen = !!openRosters[course.id];
  const descExpanded = !!expandedDescs[course.id];
  const feeExpanded = !!expandedFees[course.id];
  const feeLines = teacherFee ? teacherFee.split(/\r?\n/).map(l=>l.trim()).filter(Boolean) : [];
  const feeLinesShown = feeExpanded ? feeLines : feeLines.slice(0,3);

  let rosterRows = '';
  if(enrolledList.length===0){
    rosterRows = `<div class="roster-empty">暂无学生报名</div>`;
  }else{
    rosterRows = enrolledList.map(s=>{
      if(isAdmin){
        return `<div class="roster-row">
          <span style="display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;">
            <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
              <input type="text" class="roster-name-input" value="${escapeHtml(s.studentName)}" onchange="updateStudentName('${s.id}', this.value)" title="点击可修改姓名">
              ${s.phoneLast4 ? `<span class="roster-phone">尾号${escapeHtml(s.phoneLast4)}</span>` : ''}
            </span>
            <input type="text" class="roster-name-input" style="width:100%;font-weight:600;color:var(--ink-soft);" placeholder="家长微信昵称" value="${escapeHtml(s.wechatName||'')}" onchange="updateWechatName('${s.id}', this.value)">
          </span>
          <span style="display:flex;gap:6px;align-items:center;flex-shrink:0;">
            <button class="pay-btn ${s.paid?'paid':'unpaid'}" onclick="togglePaid('${s.id}')">${s.paid?'已收款':'待收款'}</button>
            <button class="pay-btn" style="border-color:var(--brick);color:var(--brick);" onclick="deleteSignup('${s.id}')" title="删除这条报名">✕</button>
          </span>
        </div>`;
      }
      return `<div class="roster-row"><span class="roster-name">${escapeHtml(s.studentName)}</span></div>`;
    }).join('');
  }

  const actionBtn = meta.status==='full'
    ? `<button class="btn btn-ghost" disabled>名额已满</button>`
    : `<button class="btn btn-primary" onclick="openSignupForm('${course.id}')">我要报名</button>`;

  const adminBtns = isAdmin ? `
      <button class="btn btn-ghost btn-sm" onclick="openCourseForm('${course.id}')">编辑</button>
      <button class="btn btn-danger btn-sm" onclick="deleteCourse('${course.id}')">删除</button>
  ` : '';

  const teacherInitial = teacher && teacher.name ? teacher.name.trim().charAt(0).toUpperCase() : '?';
  const seatValueClass = meta.status==='full' ? 'seat-full' : meta.status==='low' ? 'seat-low' : '';

  return `
  <div class="card" style="--card-accent:${accentColor}">
    <div class="card-teacher-tag">
      <span class="mini-avatar">🍎</span>
      <span class="mini-name">${teacher ? escapeHtml(teacher.name) : '未指定老师'}</span>
    </div>
    <h3 class="course-name">${escapeHtml(course.name||'未命名课程')}</h3>

    <div class="info-grid">
      <div class="info-cell">
        <span class="info-label">🕐 上课时间</span>
        <span class="info-value">${course.date? formatDateLabel(course.date) : '日期待定'}</span>
        <span class="info-value info-value-sub">${formatTimeRange(course.startTime, course.endTime) || '时间待定'}</span>
      </div>
      <div class="info-cell">
        <span class="info-label">🎓 适合年级</span>
        <span class="info-value">${course.grade? escapeHtml(course.grade) : '年级未设置'}</span>
      </div>
      <div class="info-cell">
        <span class="info-label">👥 剩余名额</span>
        <span class="info-value ${seatValueClass}">${meta.status==='full' ? '已满' : `${meta.remaining} / ${meta.cap}`}</span>
        ${seatDotsHtml(meta, true)}
      </div>
    </div>

    <div class="desc-block">
      <div class="desc-header">
        <span class="desc-avatar">📖</span>
        <span class="desc-label">课程简介</span>
        ${course.description ? `<button class="desc-toggle ${descExpanded?'open':''}" id="desc-toggle-${course.id}" onclick="toggleDesc('${course.id}')"><span class="label">${descExpanded?'收起':'查看详情'}</span><span class="chev">›</span></button>` : ''}
      </div>
      <div class="desc-wrap">
        <p class="desc ${course.description?'':'empty'} ${descExpanded?'expanded':''}" id="desc-${course.id}">${course.description? escapeHtml(course.description) : '机构还没有填写课程简介'}</p>
      </div>
    </div>

    <div class="desc-block" style="padding:9px 13px;">
      <div class="desc-header" style="margin-bottom:${feeLines.length ? '8px' : '0'};">
        <span class="desc-avatar">💰</span>
        <span class="desc-label">收费标准</span>
        ${feeLines.length>3 ? `<button class="desc-toggle visible" onclick="toggleFee('${course.id}')"><span class="label">${feeExpanded?'收起':'查看全部'}</span><span class="chev">${feeExpanded?'⌄':'›'}</span></button>` : ''}
      </div>
      ${feeLines.length
        ? `<div class="fee-list">${feeLinesShown.map(l=>`<div class="fee-line">${escapeHtml(l)}</div>`).join('')}</div>`
        : `<span style="font-size:12px;color:var(--slate);">机构还没有设置收费标准</span>`}
    </div>

    <button class="roster-toggle" onclick="toggleRoster('${course.id}')">${rosterOpen?'收起':'查看'}报名名单（${enrolledList.length}人） ${rosterOpen?'▲':'▼'}</button>
    <div class="roster ${rosterOpen?'open':''}" id="roster-${course.id}">${rosterRows}</div>
    <div class="card-actions">${actionBtn}${adminBtns}</div>
  </div>`;
}

function renderBoard(){
  const el = document.getElementById('boardArea');
  if(!el) return;
  if(!state.loaded){
    el.innerHTML = `<div class="empty-state"><div class="glyph">⏳</div><p>正在加载课程板…</p></div>`;
    return;
  }
  if(state.courses.length===0){
    el.innerHTML = `<div class="empty-state">
      <div class="glyph">🗓️</div>
      <h3>还没有发布任何课程</h3>
      <p>${isAdmin ? '点击右上角「＋ 发布课程」，发布第一门课吧' : '机构还没有开放报名，请稍后再来看看'}</p>
    </div>`;
    return;
  }
  const isSeedOnly = state.courses.length===1 && state.courses[0].id==='seed-course-math';

  // 按授课老师分组（原来是按日期分组，现在改成按老师分组：
  // 每位老师一个板块，板块内的课程再按 日期 + 上课时间 排序）
  const groups = {};
  state.courses.forEach(c=>{
    const key = c.teacherId || '__no_teacher__';
    (groups[key] = groups[key] || []).push(c);
  });

  // 分组顺序：跟着「老师管理」里老师的排列顺序走，未指定老师的课程统一放最后
  const teacherOrder = state.teachers.map(t=>t.id);
  const sortedKeys = Object.keys(groups).sort((a,b)=>{
    if(a==='__no_teacher__') return 1;
    if(b==='__no_teacher__') return -1;
    const ia = teacherOrder.indexOf(a), ib = teacherOrder.indexOf(b);
    if(ia===-1 && ib===-1) return 0;
    if(ia===-1) return 1;
    if(ib===-1) return -1;
    return ia-ib;
  });

  let html = '';
  if(state.offline){
    html += `<div class="seed-notice">📶 连接云端数据超时，当前为本地预览，操作可能无法保存。请检查网络后刷新页面重试。</div>`;
  }else if(isSeedOnly){
    html += `<div class="seed-notice">👋 这是示例课程，帮你预览页面效果${isAdmin ? '，可点击下方「编辑」改成真实课程，或「删除」后自行发布' : '，机构正式课程发布后会替换成真实内容'}</div>`;
  }
  sortedKeys.forEach(key=>{
    const teacher = state.teachers.find(t=>t.id===key);
    const teacherLabel = teacher ? teacher.name : '未指定老师';
    const courses = groups[key].sort((a,b)=>
      (a.date||'').localeCompare(b.date||'') || (a.startTime||'').localeCompare(b.startTime||'')
    );
    // 老师头卡（深色）+ 名下课程网格，统一包进 teacher-group 容器里，
    // 形成一个视觉整体，不管有没有填写老师简介，头卡样式保持一致
    const bioOpen = !!expandedTeacherBios[key];
    const bioHtml = (teacher && teacher.bio) ? `
        <div class="teacher-header-bio">
          <p class="teacher-bio-text ${bioOpen?'expanded':''}">${escapeHtml(teacher.bio)}</p>
          <button class="desc-toggle visible" onclick="toggleTeacherBioBlock('${key}')"><span class="label">${bioOpen?'收起':'简介'}</span><span class="chev">${bioOpen?'⌄':'›'}</span></button>
        </div>` : '';

    html += `<div class="teacher-group">
      <div class="teacher-header-card">
        <div class="teacher-header-top">
          <span class="teacher-avatar-lg">🍎</span>
          <span class="teacher-name-lg">${escapeHtml(teacherLabel)}</span>
        </div>${bioHtml}
      </div>
      <div class="teacher-group-body">`;

    // 同一位老师如果在不同日期都有课，这里再按日期拆出一个小标签，
    // 家长可以先扫一眼时间段，再决定点开哪张课程卡片，不用逐张卡片核对时间
    const uniqueDates = [...new Set(courses.map(c=>c.date || ''))];
    if(uniqueDates.length > 1){
      uniqueDates.sort((a,b)=>a.localeCompare(b)).forEach(date=>{
        const dateCourses = courses.filter(c=>(c.date||'')===date);
        html += `<div class="time-subheader"><span class="pill">${date ? formatDateLabel(date) : '日期待定'}</span><span class="sub-line"></span></div>`;
        html += `<div class="grid">${dateCourses.map(courseCardHtml).join('')}</div>`;
      });
    }else{
      html += `<div class="grid">${courses.map(courseCardHtml).join('')}</div>`;
    }
    html += `</div></div>`;
  });
  el.innerHTML = html;
  requestAnimationFrame(checkDescOverflow);
}

/* 课程简介默认最多显示 3 行（CSS line-clamp），这里检测文字是否被截断，
   只有真正超出 3 行的简介才会显示"查看详情"按钮，短简介不会出现多余按钮 */
function checkDescOverflow(){
  document.querySelectorAll('.desc-block').forEach(block=>{
    const desc = block.querySelector('.desc');
    const toggle = block.querySelector('.desc-toggle');
    if(!desc || !toggle) return;
    if(desc.classList.contains('expanded')){
      toggle.classList.add('visible');
      return;
    }
    if(desc.scrollHeight > desc.clientHeight + 2){
      toggle.classList.add('visible');
    }
  });
}
function toggleDesc(courseId){
  expandedDescs[courseId] = !expandedDescs[courseId];
  renderBoard();
}
function toggleFee(courseId){
  expandedFees[courseId] = !expandedFees[courseId];
  renderBoard();
}

function toggleRoster(courseId){
  openRosters[courseId] = !openRosters[courseId];
  renderBoard();
}

async function togglePaid(signupId){
  const s = state.signups.find(x=>x.id===signupId);
  if(!s) return;
  s.paid = !s.paid;
  renderBoard();
  const ok = await syncToCloud();
  if(ok) toast(s.paid? '已标记为已收款' : '已标记为待收款');
}

async function updateStudentName(signupId, newName){
  const name = newName.trim();
  if(!name) { toast('姓名不能为空', true); renderBoard(); return; }
  const s = state.signups.find(x=>x.id===signupId);
  if(!s) return;
  s.studentName = name;
  const ok = await syncToCloud();
  if(ok) toast('学生姓名已更新');
}

async function updateWechatName(signupId, newVal){
  const s = state.signups.find(x=>x.id===signupId);
  if(!s) return;
  s.wechatName = newVal.trim();
  const ok = await syncToCloud();
  if(ok) toast('家长微信备注已更新');
}

async function deleteSignup(signupId){
  const s = state.signups.find(x=>x.id===signupId);
  if(!s) return;
  if(!confirm(`确定要删除「${s.studentName}」的这条报名记录吗？删除后该学生会腾出一个名额。`)) return;
  state.signups = state.signups.filter(x=>x.id!==signupId);
  renderBoard();
  const ok = await syncToCloud();
  if(ok) toast('已删除该条报名');
}

function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openModal(inner){
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <button class="modal-close" onclick="closeModal()" aria-label="关闭">✕</button>
        ${inner}
      </div>
    </div>`;
}

  openModal(`

      <input type="password" id="pwInput" placeholder="请输入密码" autofocus>
      <div class="field-hint">只有机构管理人员可登录编辑课程信息</div>

function timeSelectHtml(idPrefix, currentValue){
  const parts = (currentValue||'').match(/^(\d{1,2}):(\d{2})$/);
  const curH = parts ? parts[1].padStart(2,'0') : '';
  const curM = parts ? parts[2] : '';
  let hourOpts = `<option value="">时</option>`;
  for(let h=0; h<24; h++){
    const hh = String(h).padStart(2,'0');
    hourOpts += `<option value="${hh}" ${hh===curH?'selected':''}>${hh}</option>`;
  }
  let minOpts = `<option value="">分</option>`;
  for(let m=0; m<60; m+=5){
    const mm = String(m).padStart(2,'0');
    minOpts += `<option value="${mm}" ${mm===curM?'selected':''}>${mm}</option>`;
  }
  return `<div style="display:flex;align-items:center;gap:6px;">
    <select id="${idPrefix}H" style="flex:1;">${hourOpts}</select>
    <span style="color:var(--slate);font-weight:700;">:</span>
    <select id="${idPrefix}M" style="flex:1;">${minOpts}</select>
  </div>`;
}
function readTimeSelect(idPrefix){
  const h = document.getElementById(idPrefix+'H').value;
  const m = document.getElementById(idPrefix+'M').value;
  if(!h || !m) return '';
  return `${h}:${m}`;
}

function exportExcel(){
  if(typeof XLSX === 'undefined'){ toast('导出组件加载失败，请检查网络', true); return; }
  if(state.courses.length===0){ toast('还没有课程数据可导出', true); return; }

  const teacherName = id => (state.teachers.find(t=>t.id===id)||{}).name || '未指定';

  const detail = [['课程名称','上课日期','上课时间','学生姓名','家长手机尾号','家长微信名','付款状态','报名时间']];
  state.signups.forEach(s=>{
    const c = state.courses.find(c=>c.id===s.courseId);
    detail.push([
      c? c.name : '（课程已删除）',
      c? c.date : '',
      c? formatTimeRange(c.startTime, c.endTime) : '',
      s.studentName, s.phoneLast4, s.wechatName||'', s.paid?'已收款':'待收款',
      new Date(s.ts).toLocaleString('zh-CN')
    ]);
  });

  const summary = [['日期','时间','课程名称','老师','已报名','名额上限','剩余名额','报满率']];
  state.courses.forEach(c=>{
    const meta = seatMeta(c);
    summary.push([c.date, formatTimeRange(c.startTime, c.endTime), c.name, teacherName(c.teacherId),
      meta.enrolled, meta.cap, meta.remaining, `${Math.round((meta.enrolled/meta.cap)*100)}%`]);
  });

  const teacherStats = {};
  state.courses.forEach(c=>{
    const name = teacherName(c.teacherId);
    if(!teacherStats[name]) teacherStats[name] = {courses:0, students:0};
    teacherStats[name].courses += 1;
    teacherStats[name].students += enrolledOf(c.id).length;
  });
  const tRows = [['老师姓名','带课数量','总报名人数']];
  Object.keys(teacherStats).forEach(k=>{
    tRows.push([k, teacherStats[k].courses, teacherStats[k].students]);
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(detail), "报名明细");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), "课程概览");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(tRows), "老师统计");
  XLSX.writeFile(wb, `${state.settings.orgName || 'ClassBoard'}_报表_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel 导出成功');
}

/* ========================================================================
   分享海报：把课程信息 + 报名二维码画成一张图，供长按保存后直接当图片发到微信群/朋友圈。

   为什么要这么做：微信只有「认证服务号」通过 JS-SDK（wx.updateAppMessageShareData）
   才能自定义转发链接时显示的标题/描述/图片；个人开发、没有认证公众号的网页，
   不管 <meta og:image> 怎么写，微信转发出去大概率还是显示成一个丑的默认链接图标。
   这是微信平台层面的限制，前端代码无法绕过。
   折中方案：生成一张真正的图片（canvas 绘制），图片消息在微信里天然就是大图展示，
   没有链接卡片的问题，很多培训机构的招生海报就是这样发的。
   ======================================================================== */

function isMobileDevice(){
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '') || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
}

function openPosterModal(){
  const mobile = isMobileDevice();
  openModal(`
    <h2>生成分享海报</h2>
    <p class="sub">${mobile ? '生成后长按图片选"保存图像"存到手机相册，再从相册发到微信群或朋友圈——图片比链接更抓眼球' : '生成后把图片拖拽进微信聊天窗口发送（不要用"发送文件"选它），比链接更抓眼球'}</p>
    <div id="posterPreviewBox" style="display:flex;flex-direction:column;align-items:center;gap:12px;min-height:120px;justify-content:center;">
      <div style="color:var(--slate);font-size:13px;">正在生成海报…</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
      ${mobile ? '' : '<a id="posterDownloadBtn" class="btn btn-primary" style="display:none;text-decoration:none;" download="报名海报.jpg">下载海报</a>'}
    </div>
  `);
  setTimeout(generatePosterImage, 30);
}

async function generatePosterImage(){
  const box = document.getElementById('posterPreviewBox');
  if(!box) return;
  const mobile = isMobileDevice();
  try{
    if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
    const canvas = await drawPosterCanvas();
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    box.innerHTML = `
      <img src="${dataUrl}" alt="报名海报" style="width:100%;max-width:340px;border-radius:12px;box-shadow:var(--shadow);display:block;-webkit-touch-callout:default;">
      <div style="font-size:13.5px;color:#8a611f;font-weight:800;text-align:center;line-height:1.6;">
        ${mobile
          ? '👆 长按上方图片，选"保存图像"存到相册<br>再打开相册从相册里发送给微信好友/群'
          : '👆 把上方图片拖拽进微信聊天窗口即可发送<br>（微信「发送文件」按钮选中的话会变成文件，不会是图片）'}
      </div>
    `;
    const dl = document.getElementById('posterDownloadBtn');
    if(dl){ dl.href = dataUrl; dl.style.display = 'inline-flex'; }
  }catch(err){
    box.innerHTML = `<div style="color:var(--brick);font-size:13px;">海报生成失败：${escapeHtml(String(err && err.message || err))}</div>`;
  }
}

/* 用「先量后画」两遍：第一遍只用来计算总高度（不落笔），第二遍在真正尺寸的画布上绘制，
   这样无论课程有几条，海报高度都刚好，不会留白或被裁掉 */
function drawPosterCanvas(){
  return new Promise((resolve, reject)=>{
    try{
      const W = 750;
      const measureCanvas = document.createElement('canvas');
      const mctx = measureCanvas.getContext('2d');
      const finalH = layoutPoster(mctx, W, false);

      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = finalH;
      const ctx = canvas.getContext('2d');
      layoutPoster(ctx, W, true);

      renderQrOntoCanvas(ctx, canvas, W, finalH, resolve, reject);
    }catch(e){ reject(e); }
  });
}

/* draw=false 时只计算高度，draw=true 时才真正 fill/stroke/fillText。
   返回值：整张海报最终应有的高度（二维码区域预留在 layoutPoster 之外，由 renderQrOntoCanvas 补上文字） */
function layoutPoster(ctx, W, draw){
  let y = 0;
  const pad = 40;

  // 整张画布先铺一层不透明底色——之前没有这一步，空白区域是透明的，
  // 之前用 PNG 还看不出问题，换成 JPG（不支持透明）之后空白会变黑，
  // 而且部分微信客户端对带透明通道的 PNG 处理本来就不稳定，这很可能正是
  // "转发后图片显示不出来"的根源
  if(draw){
    ctx.fillStyle = '#F7F4EC';
    ctx.fillRect(0, 0, W, ctx.canvas.height);
  }

  // 顶部色带
  const headerH = 168;
  if(draw){
    const grad = ctx.createLinearGradient(0,0,W,0);
    grad.addColorStop(0,'#3F6B52'); grad.addColorStop(1,'#2C4C3B');
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,headerH);

    const org = state.settings.orgName || 'ClassBoard';
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '700 40px "Baloo 2", "ZCOOL KuaiLe", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(truncateText(ctx, org, W-2*pad), pad, 92);
    ctx.font = '500 20px "Noto Sans SC", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.fillText('课程报名', pad, 128);
  }else{
    ctx.font = '700 40px "Baloo 2", "ZCOOL KuaiLe", sans-serif';
  }
  y = headerH + 34;

  // 收费说明
  const fee = (state.settings.feeNotice || '').trim();
  if(fee){
    const boxH = 118;
    if(draw){
      ctx.fillStyle = '#E3EDE5';
      roundRect(ctx, pad, y, W-2*pad, boxH, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(63,107,82,0.35)'; ctx.lineWidth = 1.5;
      roundRect(ctx, pad, y, W-2*pad, boxH, 12); ctx.stroke();
      ctx.fillStyle = '#2C4C3B';
      ctx.font = '700 20px "Noto Sans SC", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('💰 收费标准', pad+18, y+32);
      ctx.fillStyle = '#3A453F';
      ctx.font = '400 18px "Noto Sans SC", sans-serif';
      wrapText(ctx, fee, pad+18, y+62, W-2*pad-36, 27, 2);
    }
    y += boxH + 24;
  }

  // 课程卡片（最多 4 条，按日期排序）
  const list = [...state.courses].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,4);
  if(list.length===0){
    if(draw){
      ctx.fillStyle = '#5B6B63';
      ctx.font = '400 20px "Noto Sans SC", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('暂无课程，请先发布课程', pad, y+30);
    }
    y += 60;
  }else{
    const cardH = 116, gap = 16;
    list.forEach(course=>{
      const meta = seatMeta(course);
      const accent = meta.status==='full' ? '#A9463D' : meta.status==='low' ? '#C98A2C' : '#3F6B52';
      if(draw){
        ctx.fillStyle = '#FFFFFF';
        roundRect(ctx, pad, y, W-2*pad, cardH, 12); ctx.fill();
        ctx.strokeStyle = '#DCD5C0'; ctx.lineWidth = 1.5;
        roundRect(ctx, pad, y, W-2*pad, cardH, 12); ctx.stroke();
        ctx.fillStyle = accent;
        roundRect(ctx, pad, y, 6, cardH, 3); ctx.fill();

        ctx.fillStyle = '#1F2A24';
        ctx.font = '700 26px "Baloo 2", "ZCOOL KuaiLe", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(truncateText(ctx, course.name||'未命名课程', W-2*pad-140), pad+24, y+40);

        ctx.fillStyle = '#5B6B63';
        ctx.font = '400 18px "Noto Sans SC", sans-serif';
        const line = `${formatDateLabel(course.date)}  ${formatTimeRange(course.startTime, course.endTime)}`;
        ctx.fillText(truncateText(ctx, line, W-2*pad-48), pad+24, y+72);

        ctx.fillStyle = accent;
        ctx.font = '700 18px "Noto Sans SC", sans-serif';
        ctx.fillText(meta.status==='full' ? '名额已满' : `余 ${meta.remaining} 位`, pad+24, y+100);
      }
      y += cardH + gap;
    });
  }
  y += 8;

  // CTA 徽章
  const ctaText = '长按下方二维码 · 立即扫码报名';
  const ctaH = 56;
  if(draw){
    ctx.font = '700 24px "Noto Sans SC", sans-serif';
    const ctaW = ctx.measureText(ctaText).width + 60;
    ctx.fillStyle = '#3F6B52';
    roundRect(ctx, (W-ctaW)/2, y, ctaW, ctaH, 28); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.fillText(ctaText, W/2, y+37);
    ctx.textAlign = 'left';
  }
  y += ctaH + 28;

  // 二维码区（这里只预留空间，图像由 renderQrOntoCanvas 补画）
  const qrSize = 260, qrPad = 16;
  if(draw){
    const qrX = (W-qrSize)/2;
    ctx.fillStyle = '#FFFFFF';
    roundRect(ctx, qrX-qrPad, y-qrPad, qrSize+2*qrPad, qrSize+2*qrPad, 16); ctx.fill();
    ctx.strokeStyle = '#DCD5C0'; ctx.lineWidth = 1.5;
    roundRect(ctx, qrX-qrPad, y-qrPad, qrSize+2*qrPad, qrSize+2*qrPad, 16); ctx.stroke();
  }
  y += qrSize;

  // 底部说明文字
  const footerH = 56;
  if(draw){
    ctx.fillStyle = '#5B6B63';
    ctx.font = '400 16px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('微信扫一扫 / 长按图片识别二维码，打开报名页面', W/2, y+40);
    ctx.textAlign = 'left';
  }
  y += footerH;

  return Math.ceil(y);
}

/* qrcodejs 是异步把二维码画进一个隐藏 div 里的（内部用 canvas 或 table），
   所以要等它生成完，再把结果 drawImage 貼到海报画布对应位置上 */
function renderQrOntoCanvas(ctx, canvas, W, H, resolve, reject){
  try{
    const qrSize = 260;
    const qrPad = 16;
    // 二维码的纵向位置需要和 layoutPoster 里预留的位置完全对应，这里重新走一遍布局（不绘制）来算出 y
    const mctx = document.createElement('canvas').getContext('2d');
    const yBeforeQr = layoutPoster(mctx, W, false) - (qrSize + 56); // 减去底部说明文字与二维码本身高度
    const qrX = (W-qrSize)/2;
    const qrY = yBeforeQr;

    const qrHolder = document.createElement('div');
    qrHolder.style.cssText = 'position:fixed;left:-9999px;top:-9999px;';
    document.body.appendChild(qrHolder);
    new QRCode(qrHolder, {
      text: window.location.href,
      width: qrSize, height: qrSize,
      colorDark: '#1F2A24', colorLight: '#FFFFFF',
      correctLevel: QRCode.CorrectLevel.H
    });
    setTimeout(()=>{
      try{
        const qrCanvas = qrHolder.querySelector('canvas');
        const qrImg = qrHolder.querySelector('img');
        if(qrCanvas){ ctx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize); }
        else if(qrImg){ ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize); }
        document.body.removeChild(qrHolder);
        resolve(canvas);
      }catch(e){ reject(e); }
    }, 150);
  }catch(e){ reject(e); }
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function truncateText(ctx, text, maxWidth){
  text = String(text||'');
  if(ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while(t.length>1 && ctx.measureText(t+'…').width>maxWidth){ t = t.slice(0,-1); }
  return t + '…';
}
/* 按字符宽度自动换行（中文没有空格分词，逐字累加更靠谱），超过 maxLines 就在最后一行截断加省略号 */
function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  text = String(text||'');
  const chars = Array.from(text);
  let line = '', lineCount = 0;
  for(let i=0;i<chars.length;i++){
    const test = line + chars[i];
    if(ctx.measureText(test).width > maxWidth && line){
      if(lineCount === maxLines-1){
        ctx.fillText(truncateText(ctx, line + chars.slice(i).join(''), maxWidth), x, y + lineCount*lineHeight);
        return;
      }
      ctx.fillText(line, x, y + lineCount*lineHeight);
      lineCount++;
      line = chars[i];
    }else{
      line = test;
    }
  }
  if(line) ctx.fillText(line, x, y + lineCount*lineHeight);
}

/* 页面一打开就先画出"机构管理"按钮和基础界面，不等云端数据返回，
   避免网络慢或 Firebase 连接延迟时右上角一片空白 */
renderHeaderActions();
renderBrand();
renderBoard();

/* 兜底：如果几秒内云端数据一直没连上（网络受限、预览环境屏蔽了 Firebase 等），
   就先在本地显示示例课程，避免页面永远卡在"正在加载"。等云端真正连通后，
   onSnapshot 会用真实数据自动覆盖这里的本地示例。 */
setTimeout(()=>{
  if(state.loaded) return;
  const seed = templateSeedData();
  state.courses = seed.courses;
  state.teachers = seed.teachers;
  state.signups = seed.signups;
  state.feePlans = seed.feePlans;
  state.settings = seed.settings;
  state.loaded = true;
  state.offline = true;
  renderBrand();
  renderBoard();
  renderHeaderActions();
}, 3500);

</script>
